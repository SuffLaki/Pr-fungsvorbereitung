<meta name="theme-color" content="#0b4f9e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:#edf0f3;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
img{max-width:100%}
[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: feste Kopfzeile mit Prüfungs-Countdown, Reiter als Leiste (Desktop oben, Handy unten fixiert),
   Inhalt in einer Spalte bis 1040px, Daten in Feldkarten im Zuschnitt eines Frachtbrief-Formulars.
   Farben entstehen aus zwei Bausteinen: einem Neutralton (--n-h/--n-s, vom Design gesetzt) und
   einem Akzentton (--a-h/--a-s, von der Farbauswahl gesetzt). Hell und Dunkel ändern nur die Helligkeiten. */
:root{
  --n-h:210; --n-s:14%;          /* Neutralton */
  --a-h:212; --a-s:85%; --a-l:33%;   /* Akzentton, Helligkeit im Hellmodus */

  --grund:hsl(var(--n-h) var(--n-s) 94%);
  --flaeche:hsl(var(--n-h) var(--n-s) 99.5%);
  --flaeche2:hsl(var(--n-h) var(--n-s) 96.5%);
  --linie:hsl(var(--n-h) var(--n-s) 84%);
  --linie-stark:hsl(var(--n-h) var(--n-s) 66%);
  --text:hsl(var(--n-h) calc(var(--n-s) * 1.6) 12%);
  --leise:hsl(var(--n-h) calc(var(--n-s) * 1.2) 40%);

  --signal:hsl(var(--a-h) var(--a-s) var(--a-l));
  --signal-weich:hsl(var(--a-h) calc(var(--a-s) * 0.55) 90%);
  --signal-text:hsl(var(--a-h) var(--a-s) calc(var(--a-l) - 3%));
  --auf-signal:hsl(var(--a-h) 40% 99%);

  --gut:hsl(152 58% 27%);
  --gut-weich:hsl(152 42% 88%);
  --auf-gut:hsl(152 40% 99%);
  --achtung:hsl(36 88% 28%);
  --achtung-weich:hsl(38 72% 88%);
  --schlecht:hsl(6 68% 40%);
  --schlecht-weich:hsl(6 62% 92%);
  --auf-schlecht:hsl(6 40% 99%);

  --schrift-display:"Barlow Condensed","Arial Narrow",Helvetica,sans-serif;
  --schrift-text:"Barlow","Helvetica Neue",Arial,sans-serif;
  --schrift-daten:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  --versal:.08em;                /* Laufweite der Versalzeilen */
  --radius:10px;
  --rahmen:1px;
  --schatten:0 1px 2px hsl(var(--n-h) 20% 20% / .07),0 6px 18px hsl(var(--n-h) 20% 20% / .06);
  --karte-pad:14px;
  color-scheme:light;
}

/* ---- Dunkel: nur Helligkeiten neu, Bausteine bleiben ---- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-modus="hell"]){
    --grund:hsl(var(--n-h) calc(var(--n-s) * 1.3) 10%);
    --flaeche:hsl(var(--n-h) calc(var(--n-s) * 1.2) 14.5%);
    --flaeche2:hsl(var(--n-h) calc(var(--n-s) * 1.2) 18.5%);
    --linie:hsl(var(--n-h) calc(var(--n-s) * 1.1) 26%);
    --linie-stark:hsl(var(--n-h) var(--n-s) 42%);
    --text:hsl(var(--n-h) calc(var(--n-s) * 1.4) 93%);
    --leise:hsl(var(--n-h) calc(var(--n-s) * 0.9) 66%);
    --signal:hsl(var(--a-h) calc(var(--a-s) * 0.78) 64%);
    --signal-weich:hsl(var(--a-h) calc(var(--a-s) * 0.5) 21%);
    --signal-text:hsl(var(--a-h) calc(var(--a-s) * 0.72) 78%);
    --auf-signal:hsl(var(--a-h) 55% 9%);
    --gut:hsl(152 52% 62%);
    --gut-weich:hsl(152 38% 16%);
    --auf-gut:hsl(152 55% 8%);
    --achtung:hsl(38 78% 66%);
    --achtung-weich:hsl(38 48% 17%);
    --schlecht:hsl(6 78% 72%);
    --schlecht-weich:hsl(6 42% 19%);
    --auf-schlecht:hsl(6 55% 10%);
    --schatten:0 1px 2px hsl(0 0% 0% / .45),0 6px 18px hsl(0 0% 0% / .3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-modus="hell"]),
:root[data-modus="dunkel"]{
  --grund:hsl(var(--n-h) calc(var(--n-s) * 1.3) 10%);
  --flaeche:hsl(var(--n-h) calc(var(--n-s) * 1.2) 14.5%);
  --flaeche2:hsl(var(--n-h) calc(var(--n-s) * 1.2) 18.5%);
  --linie:hsl(var(--n-h) calc(var(--n-s) * 1.1) 26%);
  --linie-stark:hsl(var(--n-h) var(--n-s) 42%);
  --text:hsl(var(--n-h) calc(var(--n-s) * 1.4) 93%);
  --leise:hsl(var(--n-h) calc(var(--n-s) * 0.9) 66%);
  --signal:hsl(var(--a-h) calc(var(--a-s) * 0.78) 64%);
  --signal-weich:hsl(var(--a-h) calc(var(--a-s) * 0.5) 21%);
  --signal-text:hsl(var(--a-h) calc(var(--a-s) * 0.72) 78%);
  --auf-signal:hsl(var(--a-h) 55% 9%);
  --gut:hsl(152 52% 62%);
  --gut-weich:hsl(152 38% 16%);
  --auf-gut:hsl(152 55% 8%);
  --achtung:hsl(38 78% 66%);
  --achtung-weich:hsl(38 48% 17%);
  --schlecht:hsl(6 78% 72%);
  --schlecht-weich:hsl(6 42% 19%);
  --auf-schlecht:hsl(6 55% 10%);
  --schatten:0 1px 2px hsl(0 0% 0% / .45),0 6px 18px hsl(0 0% 0% / .3);
  color-scheme:dark;
}

/* ---- Akzentfarben ---- */
:root[data-akzent="verkehrsblau"]{--a-h:212;--a-s:85%}
:root[data-akzent="rostrot"]{--a-h:14;--a-s:72%}
:root[data-akzent="tanne"]{--a-h:160;--a-s:60%;--a-l:27%}
:root[data-akzent="bernstein"]{--a-h:34;--a-s:78%}
:root[data-akzent="pflaume"]{--a-h:288;--a-s:45%}
:root[data-akzent="magenta"]{--a-h:312;--a-s:70%}
:root[data-akzent="pink"]{--a-h:338;--a-s:74%}
:root[data-akzent="stahl"]{--a-h:206;--a-s:16%}

/* ---- Designs ---- */
:root[data-stil="frachtbrief"]{
  --n-h:36; --n-s:16%;
  --schrift-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --schrift-text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --versal:.14em;
  --radius:3px;
  --schatten:none;
}
:root[data-stil="frachtbrief"] .karte{border-color:var(--linie-stark)}
:root[data-stil="frachtbrief"] h1,
:root[data-stil="frachtbrief"] h2,
:root[data-stil="frachtbrief"] h3,
:root[data-stil="frachtbrief"] h4{letter-spacing:-.005em}
:root[data-stil="frachtbrief"] .karte-kopf{background:transparent;border-bottom-style:double;border-bottom-width:3px}

:root[data-stil="kompakt"]{
  --radius:6px;
  --schatten:none;
  --karte-pad:10px;
  font-size:15px;
}
:root[data-stil="kompakt"] .karte-kopf{padding:7px 11px}
:root[data-stil="kompakt"] .bereich-zeile{padding:8px 11px}
:root[data-stil="kompakt"] .stapel{gap:10px}
:root[data-stil="kompakt"] th,
:root[data-stil="kompakt"] td{padding:5px 8px}
:root[data-stil="kompakt"] .lernkarte{min-height:160px;padding:18px 16px}
:root[data-stil="kompakt"] .lernkarte .vorn{font-size:1.3rem}
:root[data-stil="kompakt"] .kennzahl b{font-size:1.45rem}
:root[data-stil="kompakt"] .option{padding:8px 10px}

/* ---- Hintergrundton (überstimmt den Neutralton des Designs) ---- */
:root[data-grund="kuehl"]{--n-h:210;--n-s:14%}
:root[data-grund="papier"]{--n-h:36;--n-s:16%}
:root[data-grund="salbei"]{--n-h:150;--n-s:12%}
:root[data-grund="taube"]{--n-h:250;--n-s:12%}
:root[data-grund="rose"]{--n-h:350;--n-s:12%}
:root[data-grund="neutral"]{--n-h:0;--n-s:0%}
:root[data-grund="akzent"]{--n-h:var(--a-h);--n-s:12%}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--grund);
  color:var(--text);
  font-family:var(--schrift-text);
  font-size:16px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:var(--schrift-display);margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:1.5rem;font-weight:700;line-height:1.15}
h2{font-size:1.4rem;font-weight:600;line-height:1.2}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
input,select{font:inherit;color:inherit}
a{color:var(--signal-text)}

/* ---------- Kopf ---------- */
.kopf{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:color-mix(in srgb,var(--flaeche) 92%,transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--linie);
}
.kopf-innen{
  max-width:1040px;margin:0 auto;padding-block:10px;padding-left:16px;padding-right:16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.marke{display:flex;align-items:center;gap:9px;min-width:0}
.marke-code{
  font-family:var(--schrift-daten);font-size:.72rem;font-weight:500;
  background:var(--signal);color:var(--auf-signal);border-radius:4px;padding:3px 6px;letter-spacing:.06em;
}
.marke-name{font-family:var(--schrift-display);font-weight:700;font-size:1.05rem;letter-spacing:.01em;white-space:nowrap}
.marke-zusatz{font-size:.74rem;color:var(--leise);white-space:nowrap}
.kopf-spacer{flex:1 1 auto}
.frist{
  display:flex;align-items:baseline;gap:6px;
  font-family:var(--schrift-daten);font-size:.8rem;color:var(--leise);
  border:1px solid var(--linie);border-radius:999px;padding:4px 11px;background:var(--flaeche2);
}
.frist b{font-size:.95rem;color:var(--text);font-weight:500}

/* ---------- Reiter ---------- */
.reiter{
  background:var(--flaeche);border-bottom:1px solid var(--linie);
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:25;
}
.reiter-innen{
  max-width:1040px;margin:0 auto;display:flex;gap:2px;padding-left:10px;padding-right:10px;
  overflow-x:auto;scrollbar-width:none;
}
.reiter-innen::-webkit-scrollbar{display:none}
.reiter button{
  background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;
  font-family:var(--schrift-display);font-weight:600;font-size:.84rem;text-transform:uppercase;
  letter-spacing:var(--versal);color:var(--leise);padding:11px 11px 9px;white-space:nowrap;
}
.reiter button[aria-selected="true"]{color:var(--signal-text);border-bottom-color:var(--signal)}
.reiter button:focus-visible{outline:2px solid var(--signal);outline-offset:-2px;border-radius:4px}

main{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-left:16px;padding-right:16px}

/* ---------- Bausteine ---------- */
.karte{
  background:var(--flaeche);border:var(--rahmen) solid var(--linie);border-radius:var(--radius);
  box-shadow:var(--schatten);
}
.karte-kopf{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid var(--linie);background:var(--flaeche2);
  border-radius:var(--radius) var(--radius) 0 0;
}
.karte-kopf h3{font-size:1rem}
.feldname{
  font-family:var(--schrift-display);font-size:.7rem;text-transform:uppercase;letter-spacing:calc(var(--versal) + .03em);
  color:var(--leise);font-weight:600;
}
.karte-leib{padding:var(--karte-pad)}
.stapel{display:flex;flex-direction:column;gap:16px}
.reihe{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.zahl{font-family:var(--schrift-daten);font-variant-numeric:tabular-nums}

.knopf{
  border:1px solid var(--signal);background:var(--signal);color:var(--auf-signal);
  border-radius:calc(var(--radius) - 2px);padding:10px 16px;cursor:pointer;font-weight:600;
  font-family:var(--schrift-text);line-height:1.2;
}
.knopf:hover{filter:brightness(1.07)}
.knopf.leise{background:var(--flaeche);color:var(--text);border-color:var(--linie-stark)}
.knopf.leise:hover{background:var(--flaeche2);filter:none}
.knopf.klein{padding:7px 11px;font-size:.88rem}
.knopf:disabled{opacity:.45;cursor:default;filter:none}
.knopf:focus-visible,.option:focus-visible,.farbfeld:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.chip{
  font-family:var(--schrift-daten);font-size:.72rem;padding:2px 7px;border-radius:5px;
  background:var(--flaeche2);border:1px solid var(--linie);color:var(--leise);white-space:nowrap;
}
.chip.signal{background:var(--signal-weich);border-color:transparent;color:var(--signal-text)}
.chip.gut{background:var(--gut-weich);border-color:transparent;color:var(--gut)}
.chip.achtung{background:var(--achtung-weich);border-color:transparent;color:var(--achtung)}
.chip.schlecht{background:var(--schlecht-weich);border-color:transparent;color:var(--schlecht)}

.balken{height:7px;border-radius:999px;background:var(--flaeche2);border:1px solid var(--linie);overflow:hidden}
.balken i{display:block;height:100%;background:var(--signal);border-radius:999px}
.balken i.gut{background:var(--gut)}

.gitter{display:grid;gap:12px}
.gitter.zwei{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.gitter.drei{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

label.feld{display:flex;flex-direction:column;gap:4px;min-width:0}
label.feld > span{font-family:var(--schrift-display);font-size:.72rem;text-transform:uppercase;letter-spacing:calc(var(--versal) + .02em);color:var(--leise);font-weight:600}
input[type=number],input[type=text],input[type=date],select{
  background:var(--flaeche);border:1px solid var(--linie-stark);border-radius:calc(var(--radius) - 3px);padding:8px 10px;
  font-family:var(--schrift-daten);font-size:.95rem;width:100%;min-width:0;
}
input:focus,select:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}

table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--linie);vertical-align:top}
th{font-family:var(--schrift-display);font-size:.74rem;text-transform:uppercase;letter-spacing:calc(var(--versal) + .01em);color:var(--leise);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--schrift-daten);font-variant-numeric:tabular-nums}
.tabelle-rahmen{overflow-x:auto}

.hinweis{
  font-size:.86rem;color:var(--leise);border-left:2px solid var(--linie-stark);padding-left:10px;
}
.notiz{background:var(--achtung-weich);color:var(--achtung);border-radius:calc(var(--radius) - 2px);padding:10px 12px;font-size:.88rem}

/* ---------- Autobahnkarten ---------- */
.lernkarte .mit-bild{
  display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap;text-align:left;
}
.lernkarte .mit-bild svg{flex:0 0 auto}
.lernkarte .mit-bild .hinten{margin:0;max-width:42ch}
.seetafel{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.seetafel svg{width:100%;height:auto;border-radius:calc(var(--radius) - 3px);border:1px solid var(--linie)}
.lernkarte .mit-bild svg{border-radius:calc(var(--radius) - 3px)}

.babraster{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px}
.babfeld{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.babfeld figcaption{
  font-family:var(--schrift-display);font-weight:700;font-size:.95rem;letter-spacing:.04em;color:var(--signal-text);
}

/* ---------- Darstellung ---------- */
.wahlreihe{display:flex;gap:6px;flex-wrap:wrap}
.wahlreihe button{
  background:var(--flaeche);border:1px solid var(--linie-stark);border-radius:calc(var(--radius) - 3px);
  padding:7px 12px;cursor:pointer;font-size:.88rem;line-height:1.2;
}
.wahlreihe button[aria-pressed="true"]{background:var(--signal-weich);border-color:var(--signal);color:var(--signal-text);font-weight:600}
/* zwei Klassen, damit die Regeln die allgemeinen Knopfregeln der Reihe überstimmen */
.wahlreihe .farbfeld{
  width:36px;height:36px;border-radius:50%;cursor:pointer;padding:0;overflow:hidden;
  border:1px solid var(--linie-stark);
}
.wahlreihe .farbfeld[aria-pressed="true"]{
  border-color:var(--text);
  box-shadow:0 0 0 2px var(--flaeche),0 0 0 4px var(--signal);
}

.anlage{border:1px solid var(--linie);border-radius:calc(var(--radius) - 3px);padding:10px 12px;background:var(--flaeche2)}
.anlage summary{cursor:pointer;font-family:var(--schrift-display);font-weight:600;font-size:.88rem}
.anlage table{font-size:.84rem}
.teilauswertung{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--linie)}
.teilauswertung:last-child{border-bottom:0;padding-bottom:0}
textarea{background:var(--flaeche);border:1px solid var(--linie-stark);border-radius:calc(var(--radius) - 3px);
  padding:9px 11px;font-family:var(--schrift-text);font-size:.95rem;width:100%;min-width:0;resize:vertical;line-height:1.45}
textarea:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}

/* ---------- Prüfungsformat ---------- */
.vorgabe{background:var(--flaeche2);border-left:3px solid var(--signal);border-radius:0 calc(var(--radius) - 3px) calc(var(--radius) - 3px) 0;padding:10px 12px}
.vorgabe p+p{margin-top:4px}
.gesetz{border:1px solid var(--linie);border-radius:calc(var(--radius) - 3px);padding:10px 12px;background:var(--flaeche2)}
.gesetz pre{margin:4px 0 0;white-space:pre-wrap;font-family:var(--schrift-text);font-size:.88rem;line-height:1.45}
.betrieb summary{cursor:pointer;font-family:var(--schrift-display);font-weight:600;font-size:.9rem;letter-spacing:.02em}
.betrieb table th{white-space:normal;width:38%;vertical-align:top}
.optionsliste{margin:0;padding-left:22px;font-size:.93rem}
.optionsliste li{margin-bottom:2px}
.zuordnung{display:flex;flex-direction:column;gap:8px}
.zuordnung-zeile{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.zuordnung-zeile select{width:64px;flex:0 0 auto}
.option input[type=checkbox]{flex:0 0 auto;width:18px;height:18px;margin:1px 0 0;accent-color:var(--signal)}

/* ---------- Start ---------- */
.frist-feld{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.kennzahl{display:flex;flex-direction:column;gap:2px}
.kennzahl b{font-family:var(--schrift-display);font-size:1.75rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kennzahl span{font-size:.76rem;color:var(--leise);text-transform:uppercase;letter-spacing:var(--versal);font-family:var(--schrift-display);font-weight:600}
.bereich-zeile{display:flex;flex-direction:column;gap:7px;padding:12px 14px;border-bottom:1px solid var(--linie)}
.bereich-zeile:last-child{border-bottom:0}
.bereich-kopf{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.bereich-kopf h4{font-size:1rem;font-weight:600;flex:1 1 auto;min-width:0}
.bereich-zahlen{display:flex;gap:14px;font-size:.8rem;color:var(--leise);font-family:var(--schrift-daten);flex-wrap:wrap}

/* ---------- Karten lernen ---------- */
.lernkarte{
  min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:14px;
  padding:26px 20px;text-align:center;cursor:pointer;
}

  { id:"r13", t:"t_zoll", q:"Zollwert 25.500 EUR, Zoll 1.198,50 EUR, Inlandsfracht bis zum ersten Bestimmungsort 300 EUR, Steuersatz 19 %. Wie hoch ist die Einfuhrumsatzsteuer?", a:5129.72, tol:1, eh:"EUR",
    w:"Bemessungsgrundlage 25.500 + 1.198,50 + 300 = 26.998,50 EUR; × 19 % = 5.129,72 EUR. Als Vorsteuer abziehbar, wenn der Einführer vorsteuerabzugsberechtigt ist." },
  { id:"r14", t:"t_kost", q:"Erlös je Sendung 420 EUR, variable Kosten 265 EUR, Fixkosten 46.500 EUR. Wie viele Sendungen sind für den Break-even nötig?", a:300, tol:1, eh:"Sendungen",
    w:"Deckungsbeitrag 420 − 265 = 155 EUR. 46.500 : 155 = 300 Sendungen." },
  { id:"r15", t:"t_zahl", q:"2 % Skonto bei Zahlung innerhalb von 10 Tagen, Zahlungsziel 30 Tage. Wie hoch ist der Jahreszins des Lieferantenkredits?", a:36, tol:0.5, eh:"%",
    w:"2 × 360 : (30 − 10) = 36 % pro Jahr." },
  { id:"r16", t:"t_kost", q:"Ein Lkw verursacht 4.200 EUR Fixkosten im Monat und 0,42 EUR variable Kosten je km. Bei 9.000 km im Monat: Wie hoch sind die Kosten je Kilometer?", a:0.89, tol:0.01, eh:"EUR/km",
    w:"4.200 : 9.000 = 0,4667 EUR/km fix; plus 0,42 EUR/km variabel = 0,8867 ≈ 0,89 EUR/km. Jeder zusätzliche Kilometer verteilt die Fixkosten weiter." },
  { id:"r17", t:"t_buch", q:"Ein Lkw kostet 132.000 EUR und wird linear über 8 Jahre abgeschrieben. Wie hoch ist die jährliche Abschreibung?", a:16500, tol:5, eh:"EUR",
    w:"132.000 : 8 = 16.500 EUR je Jahr. Nach drei Jahren beträgt der Buchwert 82.500 EUR." },
  { id:"r18", t:"t_kalk", q:"Eine Rechnung lautet auf 18.400,00 USD. Der Kurs ist 1 EUR = 1,0850 USD. Wie hoch ist der Betrag in Euro?", a:16958.53, tol:2, eh:"EUR",
    w:"18.400 : 1,0850 = 16.958,53 EUR. Division bei Fremdwährung in Euro, Multiplikation bei Euro in Fremdwährung." },
  { id:"r19", t:"t_strasse", q:"Das zulässige Gesamtgewicht eines Sattelzuges beträgt 40 t, das Leergewicht 15,2 t. Wie hoch ist die Nutzlast?", a:24.8, tol:0.1, eh:"t",
    w:"40 − 15,2 = 24,8 t. Bei Volumenladung begrenzt eher der Laderaum (ca. 34 Palettenplätze) als die Nutzlast." },
  { id:"r20", t:"t_sammel", q:"Grundfracht 780,00 EUR, Dieselzuschlag 14,5 %. Wie hoch ist der Rechnungsbetrag ohne Umsatzsteuer?", a:893.10, tol:0.2, eh:"EUR",
    w:"780 × 14,5 % = 113,10 EUR Zuschlag; 780 + 113,10 = 893,10 EUR." },
  { id:"r21", t:"t_kalk", q:"Umsatz 3.700.000 EUR, Gewinn 148.000 EUR. Wie hoch ist die Umsatzrentabilität?", a:4, tol:0.1, eh:"%",
    w:"148.000 × 100 : 3.700.000 = 4 %." },
  { id:"r22", t:"t_see", q:"In einen 20-Fuß-Container mit 33 m³ nutzbarem Laderaum sollen Kartons mit je 0,045 m³ geladen werden. Wie viele passen rein, wenn 10 % Stauverlust eingerechnet werden?", a:660, tol:5, eh:"Kartons",
    w:"Nutzbar 33 × 0,9 = 29,7 m³. 29,7 : 0,045 = 660 Kartons. Zusätzlich die Nutzlast von rund 28 t prüfen." }
];

/* Lernkarten */
const KARTEN = [
  { id:"k01", t:"t_recht", v:"Speditionsvertrag (§ 453 HGB)", h:"Der Spediteur verpflichtet sich, die Versendung des Gutes zu besorgen: Frachtführer auswählen, Verträge in eigenem Namen schließen, Papiere und Zollabwicklung organisieren. Vergütung ist die Provision, nicht die Fracht." },
  { id:"k02", t:"t_recht", v:"Frachtvertrag (§ 407 HGB)", h:"Der Frachtführer schuldet die Beförderung des Gutes zum Bestimmungsort und die Ablieferung an den Empfänger. Er haftet in der Obhutszeit verschuldensunabhängig bis 8,33 SZR/kg." },
  { id:"k03", t:"t_recht", v:"Selbsteintritt (§ 458 HGB)", h:"Der Spediteur führt die Beförderung selbst aus. Er erhält die Fracht und hat die Rechte und Pflichten eines Frachtführers." },
  { id:"k04", t:"t_recht", v:"Spedition zu festen Kosten (§ 459 HGB)", h:"Festpreis einschließlich Fracht und Nebenkosten. Der Spediteur haftet nach Frachtrecht; Zwischengewinne bleiben bei ihm." },
  { id:"k05", t:"t_recht", v:"Sammelladungsspedition (§ 460 HGB)", h:"Der Spediteur bündelt Einzelsendungen zu einer Ladung. Hinsichtlich der Beförderung gelten Frachtführerrechte und -pflichten." },
  { id:"k06", t:"t_recht", v:"Verjährung im Frachtrecht", h:"Ein Jahr ab Ablieferung (§ 439 HGB), drei Jahre bei Vorsatz oder Leichtfertigkeit mit Bewusstsein der Schadenswahrscheinlichkeit." },
  { id:"k07", t:"t_recht", v:"Schadensanzeige (§ 438 HGB)", h:"Erkennbare Schäden: spätestens bei Ablieferung. Verdeckte Schäden: innerhalb von sieben Tagen. Sonst gilt die Ware als ordnungsgemäß abgeliefert." },
  { id:"k08", t:"t_recht", v:"ADSp 2017 – Haftungsgrenzen", h:"Verkehrsvertrag: 8,33 SZR/kg, gekappt bei 1,25 Mio. EUR je Schadenfall bzw. 2 SZR/kg (höherer Betrag) und 2,5 Mio. EUR je Schadenereignis. Lagerung: 8,33 SZR/kg, max. 35.000 EUR je Schadenfall und 70.000 EUR je Inventurdifferenz." },
  { id:"k09", t:"t_recht", v:"Absenderhaftung (§ 414 HGB)", h:"Verschuldensunabhängige Haftung für unrichtige Angaben, fehlende Gefahrguthinweise, mangelhafte Verpackung und Kennzeichnung." },
  { id:"k10", t:"t_strasse", v:"CMR – Anwendungsbereich", h:"Entgeltliche Güterbeförderung auf der Straße, Übernahme- und Ablieferungsort in verschiedenen Staaten, mindestens einer davon Vertragsstaat. Haftung 8,33 SZR/kg." },
  { id:"k11", t:"t_strasse", v:"Lenk- und Ruhezeiten", h:"Tageslenkzeit 9 h (2× wöchentlich 10 h), Woche 56 h, Doppelwoche 90 h. Pause 45 min nach 4,5 h (teilbar 15 + 30). Tagesruhezeit 11 h (3× wöchentlich 9 h), Wochenruhezeit 45 h (reduziert 24 h mit Ausgleich)." },
  { id:"k12", t:"t_strasse", v:"Kabotage", h:"Nach einer grenzüberschreitenden Beförderung bis zu drei Inlandsfahrten in sieben Tagen, danach vier Tage Karenz im selben Mitgliedstaat." },
  { id:"k13", t:"t_strasse", v:"Lkw-Maut", h:"Pflicht ab 7,5 t zGG auf Bundesfernstraßen. Teilsätze für Infrastruktur, Luftverschmutzung, Lärm und CO₂; Erfassung über On-Board-Unit, App oder Terminal." },
  { id:"k14", t:"t_sammel", v:"Sammelgutverkehr – Ablauf", h:"Vorlauf im Nahverkehr → Umschlag beim Versandspediteur → Hauptlauf als Ladung → Umschlag beim Empfangsspediteur → Nachlauf im Nahverkehr. Begleitpapier ist das Bordero." },
  { id:"k15", t:"t_sammel", v:"Frachtpflichtiges Gewicht", h:"Straße: 1 m³ = 333 kg, 1 ldm = ca. 1.850 kg. Luftfracht: 6.000 cm³ = 1 kg. Seefracht W/M: 1 t oder 1 m³. Maßgeblich ist immer der höhere Wert." },
  { id:"k16", t:"t_see", v:"Konnossement (B/L)", h:"Empfangsbestätigung, Beweis des Seefrachtvertrags und Traditionspapier: Nur gegen Vorlage des Originals wird ausgeliefert, deshalb im Akkreditivgeschäft unverzichtbar." },
  { id:"k17", t:"t_see", v:"FCL und LCL", h:"FCL: ein Versender nutzt den ganzen Container, Packen beim Versender. LCL: Sammelcontainer, Stuffing und Stripping im Container Freight Station." },
  { id:"k18", t:"t_see", v:"Containermaße (Faustwerte)", h:"20': ca. 33 m³, Nutzlast ca. 28 t. 40': ca. 67 m³. 40' High Cube: ca. 76 m³. Schwere Ladung stößt an die Nutzlast, leichte an das Volumen." },
  { id:"k19", t:"t_see", v:"Demurrage und Detention", h:"Demurrage: Liegegeld für den Container im Terminal nach Ablauf der Freitage. Detention: Standgeld für den Container außerhalb des Terminals beim Kunden." },
  { id:"k20", t:"t_luft", v:"Air Waybill (AWB)", h:"Beweis des Vertrags, Empfangsbestätigung, Abrechnungs- und Zollgrundlage – aber kein Traditionspapier und nicht übertragbar. Drei Originale: Carrier, Consignee, Shipper." },
  { id:"k21", t:"t_luft", v:"Chargeable Weight", h:"Höherer Wert aus tatsächlichem Gewicht und Volumengewicht (L × B × H in cm : 6.000). Zusätzlich die günstigere höhere Gewichtsstufe prüfen." },
  { id:"k22", t:"t_luft", v:"Luftsicherheit", h:"Bekannter Versender liefert sichere Fracht an den reglementierten Beauftragten. Unsichere Fracht muss kontrolliert werden (Röntgen, Sprengstoffspürhund, andere zugelassene Verfahren)." },
  { id:"k23", t:"t_bahn", v:"Kombinierter Verkehr", h:"Unbegleitet: Container, Wechselbrücke, kranbarer Sattelauflieger. Begleitet: Rollende Landstraße mit Fahrer. Vorteil: Flächenbedienung der Straße plus Massenleistung der Schiene." },
  { id:"k24", t:"t_bahn", v:"Haftungsgrenzen im Vergleich", h:"CIM/Schiene 17 SZR/kg · CMR/HGB Straße 8,33 SZR/kg · Luftfracht (MÜ) 22 SZR/kg · Seefracht 666,67 SZR/Stück oder 2 SZR/kg · Binnenschiff (CMNI) wie Seefracht." },
  { id:"k25", t:"t_lager", v:"Lagerkennzahlen", h:"⌀Lagerbestand = (AB + EB) : 2 · Umschlagshäufigkeit = Jahresabgang : ⌀Bestand · ⌀Lagerdauer = 360 : UH · Lagerzinssatz = Jahreszins × Lagerdauer : 360." },
  { id:"k26", t:"t_lager", v:"Kontraktlogistik", h:"Langfristige, kundenindividuelle Verträge mit Mehrwertleistungen (Kommissionierung, Konfektionierung, Retouren, Qualitätskontrolle). Hohe Bindung, hohe Vorleistung, längere Amortisation." },
  { id:"k27", t:"t_lager", v:"Cross-Docking", h:"Umschlag ohne Einlagerung: Eingangsware wird direkt für Ausgangstouren kommissioniert. Senkt Bestände und Durchlaufzeit, verlangt präzise Avise und Termintreue." },
  { id:"k28", t:"t_lager", v:"ABC-Analyse", h:"A: wenige Artikel, hoher Wertanteil – kurze Wege, enge Kontrolle. B: mittlere Bedeutung. C: viele Artikel, geringer Anteil – vereinfachte Steuerung." },
  { id:"k29", t:"t_zoll", v:"Incoterms 2020 – Gruppen", h:"E: EXW (Abholung). F: FCA, FAS, FOB (Versandklauseln, Käufer zahlt Hauptfracht). C: CFR, CIF, CPT, CIP (Verkäufer zahlt Fracht, Gefahr geht früher über). D: DAP, DPU, DDP (Ankunftsklauseln)." },
  { id:"k30", t:"t_zoll", v:"Zollwert und EUSt", h:"Zollwert = Transaktionswert + Kosten bis zur EU-Außengrenze. Einfuhrumsatzsteuer-Bemessungsgrundlage = Zollwert + Zoll + Kosten bis zum ersten Bestimmungsort im Inland." },
  { id:"k31", t:"t_zoll", v:"Unionsversandverfahren", h:"T1 für Nicht-Unionswaren, T2 für Unionswaren über Drittländer. Bewegung unter zollamtlicher Überwachung mit Sicherheitsleistung, Abwicklung elektronisch über ATLAS/NCTS." },
  { id:"k32", t:"t_zoll", v:"Präferenznachweise", h:"Erklärung zum Ursprung durch registrierte Ausführer (REX), EUR.1 bzw. EUR-MED, Lieferantenerklärung für die Vorkette. Wirkung: reduzierter oder entfallender Zoll im Partnerland." },
  { id:"k33", t:"t_vers", v:"Verkehrshaftung vs. Warenversicherung", h:"Verkehrshaftungsversicherung schützt die Haftung des Dienstleisters (begrenzt, verschuldensabhängige Ausschlüsse). Die Warentransportversicherung deckt den Warenwert des Versenders – ICC A, B oder C." },
  { id:"k34", t:"t_vers", v:"Versicherungssumme bei CIF/CIP", h:"110 % des Warenwerts in der Vertragswährung, Deckung vom Lieferort bis zum benannten Bestimmungsort. CIP verlangt ICC A, CIF nur ICC C." },
  { id:"k35", t:"t_gefahr", v:"Gefahrgutregelwerke", h:"ADR Straße · RID Schiene · ADN Binnenschiff · IMDG-Code Seeschiff · IATA-DGR/ICAO-TI Luftfracht. Neun Gefahrklassen, Kennzeichnung über UN-Nummer und Gefahrzettel." },
  { id:"k36", t:"t_gefahr", v:"Verladeverantwortung (§ 412 HGB)", h:"Absender: beförderungssichere Verladung und Sicherung. Frachtführer: betriebssichere Verladung, Achslasten, Gesamtgewicht, Verkehrssicherheit. Technische Regel: VDI 2700 ff." },
  { id:"k37", t:"t_buch", v:"Inventurarten", h:"Stichtagsinventur am Abschlusstag · verlegte Inventur mit Wertfortschreibung (3 Monate vor / 2 Monate nach dem Stichtag) · permanente Inventur über die Lagerbuchführung · Stichprobeninventur." },
  { id:"k38", t:"t_buch", v:"Rückstellung oder Verbindlichkeit?", h:"Rückstellung: Verpflichtung dem Grund nach sicher, Höhe oder Zeitpunkt ungewiss. Verbindlichkeit: Betrag und Fälligkeit stehen fest." },
  { id:"k39", t:"t_kost", v:"Kalkulatorische Kosten", h:"Zusatzkosten ohne Aufwand (kalkulatorischer Unternehmerlohn, kalkulatorische Miete, Eigenkapitalzinsen) und Anderskosten mit abweichender Höhe (kalkulatorische Abschreibung vom Wiederbeschaffungswert, Wagnisse)." },
  { id:"k40", t:"t_kost", v:"Fixe und variable Lkw-Kosten", h:"Fix: Abschreibung, Versicherung, Kfz-Steuer, Verwaltung, Grundlohn. Variabel: Diesel, AdBlue, Maut, Reifen, leistungsabhängige Reparatur. Je mehr Kilometer, desto niedriger die Fixkosten je km." },
  { id:"k41", t:"t_kost", v:"Deckungsbeitrag und Break-even", h:"DB = Erlös − variable Kosten. Break-even-Menge = Fixkosten : DB je Einheit. Unter Vollkosten kann ein Auftrag kurzfristig tragfähig sein, solange der DB positiv ist." },
  { id:"k42", t:"t_kalk", v:"Bezugskalkulation", h:"Listeneinkaufspreis − Rabatt = Zieleinkaufspreis − Skonto = Bareinkaufspreis + Bezugskosten = Bezugspreis. Erst der Bezugspreis macht Angebote vergleichbar." },
  { id:"k43", t:"t_kalk", v:"Wichtige Kennzahlen", h:"Eigenkapitalquote = EK × 100 : GK · Umsatzrentabilität = Gewinn × 100 : Umsatz · EK-Rentabilität = Gewinn × 100 : EK · Liquidität 1. Grades = flüssige Mittel × 100 : kurzfristige Verbindlichkeiten." },
  { id:"k44", t:"t_zahl", v:"Verzug und Verzugszinsen", h:"Verzug nach Mahnung oder 30 Tagen nach Rechnungszugang. Zinsen: 5 Prozentpunkte über Basiszins gegenüber Verbrauchern, 9 Prozentpunkte zwischen Unternehmen plus 40 EUR Pauschale." },
  { id:"k45", t:"t_zahl", v:"Reverse Charge im Transport", h:"Transportleistung an EU-Unternehmer: Leistungsort beim Empfänger (§ 3a Abs. 2 UStG), Rechnung ohne Steuer mit Hinweis auf die Steuerschuldumkehr, beide USt-IdNr. angeben, Zusammenfassende Meldung abgeben." },
  { id:"k46", t:"t_ausb", v:"Pflichten im Ausbildungsverhältnis", h:"Ausbildender: planmäßige Ausbildung, kostenlose Ausbildungsmittel, Freistellung für Schule und Prüfung, Zeugnis. Auszubildender: Lernpflicht, Weisungen beachten, Berichtsheft, Sorgfalt, Schweigepflicht." },
  { id:"k47", t:"t_ausb", v:"Rangordnung der Rechtsquellen", h:"EU-Recht → Gesetz → Tarifvertrag → Betriebsvereinbarung → Arbeitsvertrag → Weisung. Günstigkeitsprinzip: die für den Arbeitnehmer bessere Regelung setzt sich durch." },
  { id:"k48", t:"t_ausb", v:"Betriebsrat", h:"Wählbar ab fünf wahlberechtigten Arbeitnehmern, Wahl alle vier Jahre. Echte Mitbestimmung u. a. bei Arbeitszeit, Urlaubsgrundsätzen, technischer Überwachung und betrieblicher Lohngestaltung (§ 87 BetrVG)." },
  { id:"k49", t:"t_sozial", v:"Fünf Zweige der Sozialversicherung", h:"Kranken-, Pflege-, Renten-, Arbeitslosen- und Unfallversicherung. Die Unfallversicherung zahlt allein der Arbeitgeber (Berufsgenossenschaft, für Verkehr die BG Verkehr)." },
  { id:"k50", t:"t_sozial", v:"Beitragssätze 2026", h:"RV 18,6 % · AV 2,6 % · KV 14,6 % plus kassenindividueller Zusatzbeitrag · PV 3,6 % (kinderlos ab 23 Jahren 4,2 %). Regelmäßig hälftig geteilt. Beitragsbemessungsgrenzen jährlich prüfen." },
  { id:"k51", t:"t_sozial", v:"Entgeltfortzahlung", h:"Bis zu sechs Wochen durch den Arbeitgeber nach vierwöchiger Beschäftigung, danach Krankengeld der Kasse: 70 % des Brutto-, höchstens 90 % des Nettoentgelts." },
  { id:"k52", t:"t_wirt", v:"Rechtsformen im Überblick", h:"Einzelunternehmen: volle Haftung. OHG: alle Gesellschafter unbeschränkt. KG: Komplementär unbeschränkt, Kommanditist mit Einlage. GmbH: 25.000 EUR Stammkapital. AG: 50.000 EUR Grundkapital. UG: ab 1 EUR mit Rücklagepflicht." },
  { id:"k53", t:"t_wirt", v:"Prokura", h:"Handlungsvollmacht für alle gewöhnlichen Geschäfte des Handelsgewerbes, eingetragen im Handelsregister. Nicht umfasst: Grundstücksverkauf ohne besondere Befugnis, Bilanzunterzeichnung, Insolvenzantrag, Unternehmensverkauf." },
  { id:"k54", t:"t_vertrag", v:"Rechte bei Sachmängeln", h:"Nacherfüllung (Nachbesserung oder Ersatzlieferung) → Rücktritt oder Minderung → Schadensersatz. Verjährung bei beweglichen Sachen zwei Jahre; beim Verbrauchsgüterkauf gilt im ersten Jahr die Beweislastumkehr." },
  { id:"k55", t:"t_vertrag", v:"Produkthaftung", h:"ProdHaftG: verschuldensunabhängige Haftung des Herstellers für Personen- und Sachschäden durch fehlerhafte Produkte, Selbstbeteiligung 500 EUR bei Sachschäden. Daneben § 823 BGB (Produzentenhaftung)." },
  { id:"k56", t:"t_nachh", v:"Emissionen je Verkehrsträger", h:"Niedrig: elektrifizierte Schiene und Binnenschiff. Deutlich höher: Lkw. Am höchsten: Luftfracht. Berechnung der Transportemissionen nach ISO 14083 bzw. GLEC-Framework." },
  { id:"k57", t:"t_nachh", v:"Arbeitsschutz im Lager", h:"Gefährdungsbeurteilung, Unterweisung, PSA (Sicherheitsschuhe, Warnweste), jährliche Regalprüfung, Flurförderzeugausweis, Verbandbuch; Unfälle mit mehr als drei Tagen Ausfall an die BG melden." },
  { id:"k58", t:"t_recht", v:"SZR (Sonderziehungsrecht)", h:"Rechnungseinheit des Internationalen Währungsfonds, Grundlage aller Haftungsgrenzen im Transportrecht. Der Umrechnungskurs wird täglich veröffentlicht; für Schadensfälle gilt der Kurs am Tag der Zahlung bzw. des Urteils." },
  { id:"k59", t:"t_sammel", v:"Lademeter (ldm)", h:"Ein Lademeter ist ein laufender Meter Ladefläche über die gesamte Breite. Europalette längs 0,4 ldm, quer 0,5 ldm; Industriepalette 0,5 ldm. Übliche Umrechnung 1 ldm = 1.850 kg." },
  { id:"k60", t:"t_zoll", v:"AEO-Status", h:"Zugelassener Wirtschaftsbeteiligter: AEO-C für zollrechtliche Vereinfachungen, AEO-S für Sicherheit in der Lieferkette. Vorteile: weniger Kontrollen, Vorrang bei der Abfertigung, Anerkennung durch Partnerländer." },
  { id:"k61", t:"t_bab", bab:"A1", v:"A1 – Verlauf", h:"Heiligenhafen (Ostsee) – Lübeck – Hamburg – Bremen – Osnabrück – Münster – Dortmund – Wuppertal – Köln – Trier – Saarbrücken. Der Abschnitt Hamburg–Bremen–Ruhrgebiet heißt Hansalinie und ist eine der wichtigsten Stückgutrelationen." },
  { id:"k62", t:"t_bab", bab:"A2", v:"A2 – Verlauf", h:"Oberhausen – Dortmund – Bielefeld – Hannover – Braunschweig – Magdeburg – Berliner Ring. Wichtigste Ost-West-Achse des Güterverkehrs und Hauptroute Richtung Polen; dicht belegt mit Logistikzentren." },
  { id:"k63", t:"t_bab", bab:"A3", v:"A3 – Verlauf", h:"Emmerich/Elten (Grenze NL) – Oberhausen – Düsseldorf – Köln – Frankfurt – Würzburg – Nürnberg – Regensburg – Passau (Grenze AT). Verbindet die Rhein-Ruhr-Region mit dem Südosten und den Seehäfen der Nordsee über das Rheinland." },
  { id:"k64", t:"t_bab", bab:"A4", v:"A4 – Verlauf", h:"Aachen – Köln – Olpe, dann Unterbrechung, ab Kirchheimer Dreieck weiter über Eisenach – Erfurt – Gera – Chemnitz – Dresden – Görlitz (Grenze PL). Einzige große Autobahn mit einer Lücke im Verlauf." },
  { id:"k65", t:"t_bab", bab:"A5", v:"A5 – Verlauf", h:"Hattenbacher Dreieck – Gießen – Frankfurt – Darmstadt – Heidelberg – Karlsruhe – Freiburg – Weil am Rhein (Grenze CH). Nord-Süd-Achse der Rheinschiene, Hauptroute in die Schweiz und nach Italien." },
  { id:"k66", t:"t_bab", bab:"A6", v:"A6 – Verlauf", h:"Saarbrücken (Grenze FR) – Kaiserslautern – Mannheim – Heilbronn – Nürnberg – Amberg – Waidhaus (Grenze CZ). Südliche West-Ost-Verbindung nach Tschechien und Südosteuropa." },
  { id:"k67", t:"t_bab", bab:"A7", v:"A7 – Verlauf", h:"Flensburg/Ellund (Grenze DK) – Hamburg – Hannover – Kassel – Fulda – Würzburg – Ulm – Kempten – Füssen (Grenze AT). Mit rund 965 km die längste deutsche Autobahn und die zentrale Nord-Süd-Achse Skandinavien–Alpen." },
  { id:"k68", t:"t_bab", bab:"A8", v:"A8 – Verlauf", h:"Perl/Schengen (Grenze LU) – Saarbrücken – Karlsruhe – Pforzheim – Stuttgart – Ulm – Augsburg – München – Salzburg (Grenze AT). Hauptachse Baden-Württemberg–Bayern, abschnittsweise stark überlastet." },
  { id:"k69", t:"t_bab", bab:"A9", v:"A9 – Verlauf", h:"München – Ingolstadt – Nürnberg – Bayreuth – Hof – Leipzig – Dessau – Berlin. Verbindet die beiden größten Wirtschaftsräume Bayerns mit Mitteldeutschland und Berlin." },
  { id:"k70", t:"t_bab", v:"Merkhilfe: gerade und ungerade Autobahnnummern", h:"Einstellige Autobahnen mit ungerader Nummer (A1, A3, A5, A7, A9) verlaufen überwiegend in Nord-Süd-Richtung, solche mit gerader Nummer (A2, A4, A6, A8) überwiegend in West-Ost-Richtung. Die Nummern steigen von West nach Ost bzw. von Nord nach Süd." },
  { id:"k71", t:"t_meer", meer:"suez", v:"Suezkanal", h:"Verbindet Mittelmeer und Rotes Meer, rund 193 km lang, schleusenlos, seit 1869 in Betrieb. Kürzt Asien–Europa um etwa 3.500 Seemeilen ab. Namensgeber der Schiffsklasse Suezmax." },

  ], a:0, e:"Jugendliche dürfen an höchstens fünf Tagen in der Woche und in der Regel nicht an Samstagen, Sonntagen und Feiertagen beschäftigt werden; die tägliche Arbeitszeit beträgt höchstens acht Stunden." },

  { id:"w04", b:"wiso", typ:"mc", p:3, t:"t_ausb", si:"si_kuend",
    q:"Prüfen Sie, welche Aussage zur Beteiligung des Betriebsrats an der Kündigung von Herrn Yildiz zutrifft!", o:[

    "Der Betriebsrat muss der Kündigung ausdrücklich zustimmen, sonst ist sie unwirksam.",
    "Der Betriebsrat ist erst nach Zugang der Kündigung zu informieren.",
    "Eine Anhörung ist nur bei außerordentlichen Kündigungen erforderlich.",

  ], a:0, e:"§ 102 BetrVG: Anhörung vor Ausspruch der Kündigung. Bei einer ordentlichen Kündigung kann der Betriebsrat binnen einer Woche schriftlich widersprechen; die Kündigung bleibt aber möglich." },

  { id:"w05", b:"wiso", typ:"mc", p:3, t:"t_ausb",

    "Einführung einer technischen Einrichtung, die zur Überwachung von Leistung und Verhalten geeignet ist",

    "Entscheidung über den Kauf einer neuen Sattelzugmaschine",
    "Bestimmung des Standorts einer neuen Niederlassung"
  ], a:0, e:"Erzwingbare Mitbestimmung besteht unter anderem bei Beginn und Ende der täglichen Arbeitszeit, Urlaubsgrundsätzen, betrieblicher Lohngestaltung und technischen Überwachungseinrichtungen." },

  { id:"w06", b:"wiso", typ:"mc", p:3, t:"t_ausb",
    q:"Prüfen Sie, welche Aussage zum Tarifvertragsrecht zutrifft!", o:[

    "Ein Tarifvertrag gilt automatisch für alle Branchen eines Bundeslandes.",

  { id:"w07", b:"wiso", typ:"mc", p:3, t:"t_ausb",

  { id:"w08", b:"wiso", typ:"mc", p:3, t:"t_ausb",
    q:"Eine Sachbearbeiterin der Donautal GmbH ist schwanger. Stellen Sie fest, welche Aussage zum Mutterschutz zutrifft!", o:[
    "In den letzten sechs Wochen vor der Entbindung darf sie nur beschäftigt werden, wenn sie sich ausdrücklich dazu bereit erklärt.",
    "Der besondere Kündigungsschutz endet mit dem Beginn der Schutzfrist.",
    "Nach der Entbindung darf sie auf eigenen Wunsch sofort wieder beschäftigt werden.",
    "Das Mutterschutzgesetz gilt nicht für Arbeitnehmerinnen in leitender Tätigkeit.",
    "Die Schutzfristen gelten nur, wenn das Arbeitsverhältnis länger als zwei Jahre besteht."
  ], a:0, e:"Sechs Wochen vor der Entbindung besteht ein Beschäftigungsverbot, von dem die Frau sich befreien kann; nach der Entbindung gilt für acht Wochen ein absolutes Beschäftigungsverbot." },

  { id:"w09", b:"wiso", typ:"mc", p:3, t:"t_ausb",
    q:"Prüfen Sie, welche Aussage zum Arbeitszeugnis zutrifft!", o:[
    "Der Arbeitnehmer hat auf Verlangen Anspruch auf ein Zeugnis über Leistung und Verhalten.",

  ], a:0, e:"§ 109 GewO: einfaches Zeugnis zu Art und Dauer, auf Verlangen qualifiziertes Zeugnis zu Leistung und Verhalten. Die elektronische Form ist ausdrücklich ausgeschlossen." },

  /* ---------- Sozialversicherung und Entgelt ---------- */
  { id:"w10", b:"wiso", typ:"mc", p:3, t:"t_sozial", si:"si_lohn",

  { id:"w11", b:"wiso", typ:"mc", p:3, t:"t_sozial",
    q:"Eine Mitarbeiterin der Donautal GmbH rutscht auf dem direkten Weg zur Arbeit aus und verletzt sich. Geben Sie an, welche Versicherung für die Arztkosten aufkommt!", o:[

  { id:"w12", b:"wiso", typ:"mc", p:3, t:"t_sozial",
    q:"Prüfen Sie, welche Aussage zur Entgeltfortzahlung im Krankheitsfall zutrifft!", o:[
    "Der Arbeitgeber zahlt bis zu sechs Wochen fort, danach zahlt die Krankenkasse Krankengeld.",

    "Bei selbst verschuldeter Arbeitsunfähigkeit besteht der Anspruch unverändert."

  { id:"w13", b:"wiso", typ:"mc", p:3, t:"t_sozial", si:"si_lohn",
    q:"Stellen Sie fest, wonach sich die Lohnsteuerklasse eines Arbeitnehmers richtet!", o:[

    "Nach dem Wohnsitz des Arbeitnehmers",

  { id:"w14", b:"wiso", typ:"mc", p:3, t:"t_sozial",
    q:"Das Finanzamt hat einer Angestellten einen monatlichen Freibetrag von 250,00 EUR eingetragen. Prüfen Sie, welche Auswirkung das hat!", o:[

  { id:"w15", b:"wiso", typ:"mc", p:3, t:"t_sozial",
    q:"Geben Sie an, welche Aufwendung ein Arbeitnehmer als Werbungskosten geltend machen kann!", o:[

  /* ---------- Rechtsgeschäfte, Kaufvertrag, Rechtsformen ---------- */
  { id:"w16", b:"wiso", typ:"mc", p:3, t:"t_vertrag",
    q:"Die Donautal GmbH erhält ein schriftliches, verbindliches Angebot über zehn Hubwagen. Stellen Sie fest, welche Aussage zutrifft!", o:[
    "Mit der fristgerechten, inhaltsgleichen Bestellung kommt der Kaufvertrag zustande.",
    "Der Kaufvertrag kommt erst mit der Lieferung der Hubwagen zustande.",
    "Der Kaufvertrag kommt erst mit der Bezahlung der Rechnung zustande.",
    "Das Angebot ist für den Anbieter unverbindlich, weil es schriftlich erteilt wurde.",
    "Die Bestellung muss notariell beurkundet werden."
  ], a:0, e:"Zwei übereinstimmende Willenserklärungen genügen. Weicht die Bestellung vom Angebot ab, ist sie eine Ablehnung verbunden mit einem neuen Antrag." },

  { id:"w17", b:"wiso", typ:"mc", p:3, t:"t_vertrag",
    q:"Die Donautal GmbH erwirbt ein Grundstück für eine neue Umschlagshalle. Prüfen Sie, welche Formvorschrift gilt!", o:[
    "Der Kaufvertrag ist notariell zu beurkunden.",

  ], a:0, e:"§ 311b BGB. Eigentümerin wird die Gesellschaft erst mit Auflassung und Eintragung im Grundbuch." },

  { id:"w18", b:"wiso", typ:"mc", p:3, t:"t_vertrag",
    q:"Bei der Wareneingangskontrolle stellt die Donautal GmbH einen Mangel an gelieferten Regalböden fest. Stellen Sie fest, welches Recht vorrangig besteht!", o:[

    "Rücktritt vom Kaufvertrag",

    "Schadensersatz statt der Leistung",
    "Ersatz vergeblicher Aufwendungen"
  ], a:0, e:"§ 437 BGB: zuerst Nacherfüllung (Nachbesserung oder Ersatzlieferung), danach Rücktritt oder Minderung, zuletzt Schadensersatz. Unter Kaufleuten gilt zusätzlich die Rügepflicht nach § 377 HGB." },

  { id:"w19", b:"wiso", typ:"mc", p:3, t:"t_vertrag",
    q:"Prüfen Sie, welche Aussage zum Eigentumsvorbehalt bei einem Gabelstapler zutrifft!", o:[

    "Die Donautal GmbH darf den Gabelstapler bis zur vollständigen Zahlung nicht nutzen.",
    "Der Verkäufer bleibt auch nach vollständiger Zahlung Eigentümer.",
    "Der Eigentumsvorbehalt erlischt mit der Übergabe des Gabelstaplers.",
    "Der Eigentumsvorbehalt muss im Handelsregister eingetragen werden."
  ], a:0, e:"Besitz und Nutzung gehen sofort über, das Eigentum erst mit der letzten Rate. Der verlängerte Eigentumsvorbehalt erstreckt sich auf Weiterverkauf und Forderungsabtretung." },

  { id:"w20", b:"wiso", typ:"mc", p:3, t:"t_wirt",

    "Die Gesellschafter haften unmittelbar und unbeschränkt für die Verbindlichkeiten der Gesellschaft.",

    "Das Stammkapital beträgt mindestens 25.000,00 EUR.",
    "Die Gesellschaft wird durch die Geschäftsführer vertreten.",

  { id:"w21", b:"wiso", typ:"mc", p:3, t:"t_wirt",

  { id:"w23", b:"wiso", typ:"mc", p:3, t:"t_wirt",

  { id:"w24", b:"wiso", typ:"mc", p:3, t:"t_wirt",

  { id:"w25", b:"wiso", typ:"mc", p:3, t:"t_wirt",

  { id:"w26", b:"wiso", typ:"mc", p:3, t:"t_wirt",

  { id:"w27", b:"wiso", typ:"mc", p:3, t:"t_wirt",

  { id:"w28", b:"wiso", typ:"mc", p:3, t:"t_nachh",

  { id:"w31", b:"wiso", typ:"zuordnung", p:4, t:"t_sozial",

  { id:"w32", b:"wiso", typ:"zuordnung", p:4, t:"t_ausb",

      { nr: 3, punkte: 11.5, minuten: 20, anlage: "anl_bl",
        situation: "Sie sind Mitarbeiter der Donautal GmbH, Niederlassung Hamburg, Abteilung Seefracht Import. Von Ihrem Kunden, der Zeutzer GmbH, München, einem Großhandel für Sanitärbedarf, haben Sie den Auftrag erhalten, den Import einer Sendung Duscharmaturen aus Vietnam abzuwickeln. Das Konnossement liegt Ihnen bereits vor (siehe Anlage).",
        teile: [
          { nr: "3.1", punkte: 2, q: "Ermitteln Sie aus dem abgebildeten Bill of Lading, um welche Art von Konnossement es sich bezüglich a) des Nachweises der Verladung und b) der Unversehrtheit der Ware handelt, und begründen Sie jeweils Ihre Aussage!",
            loesung: "a) Bordkonnossement (Shipped on Board B/L), 1 Punkt: Der Vermerk „SHIPPED ON BOARD“ mit Datum bestätigt, dass die Ware tatsächlich an Bord genommen wurde – nicht nur zur Verschiffung übernommen (Received for Shipment).\nb) Reines Konnossement (Clean B/L), 1 Punkt: Es enthält keine Eintragung über äußerlich erkennbare Mängel an Ware oder Verpackung." },
          { nr: "3.2", punkte: 1, q: "Benennen Sie für diesen Kundenauftrag die Art des Container-Rundlaufs und geben Sie an, wie viele Original-Konnossemente Sie mindestens zur Abholung der Ware im Hafen Rotterdam vorlegen müssen!",
            loesung: "Container-Rundlauf: FCL/FCL bzw. CY/CY – der Container wird beim Versender gepackt und beim Empfänger entladen (0,5 Punkte).\nVorzulegen ist mindestens ein Original-Konnossement aus dem Satz von 3/3; mit Vorlage eines Originals werden die übrigen wertlos (0,5 Punkte)." },
          { nr: "3.3", punkte: 1, q: "Nach Anweisung der Zeutzer GmbH soll die Überlassung zum zollrechtlich freien Verkehr am Zollamt in München erfolgen. Begründen Sie, welches Zollverfahren in Rotterdam eröffnet werden muss, damit die Ware in München verzollt werden kann!",
            loesung: "Externes Unionsversandverfahren T1. Die Ware ist Nicht-Unionsware; sie kann unter zollamtlicher Überwachung und unter Sicherheitsleistung bis zur Bestimmungszollstelle in München befördert werden, wo die Überlassung zum freien Verkehr erfolgt." },
          { nr: "3.4", punkte: 6, q: "Die Zeutzer GmbH möchte vorab wissen, wie hoch die Einfuhrabgaben sein werden. Berechnen Sie anhand der abgebildeten Informationen die Summe der Einfuhrabgaben in EUR! Geben Sie den Rechenweg an.",
            loesung: "Zollwert (bis zur EU-Außengrenze), 2,5 Punkte:\nRechnungswert 68.320,00 + Vorlauf 340,00 + Seefracht 1.780,00 + Versicherung 190,00 + BAF 2 TEU × 250,00 = 500,00 + CAF 7 % von 1.780,00 = 124,60\n= 71.254,60 USD : 1,22 = 58.405,41 EUR\nZoll (1 Punkt): 58.405,41 × 3,2 % = 1.868,97 EUR\nBemessungsgrundlage EUSt (1,5 Punkte): Zollwert 58.405,41 + Zoll 1.868,97 + THC 2 TEU × 130,00 = 260,00 + Nachlauf bis München 650,00 = 61.184,38 EUR\nEinfuhrumsatzsteuer (0,5 Punkte): 61.184,38 × 19 % = 11.625,03 EUR\nSumme der Einfuhrabgaben (0,5 Punkte): 1.868,97 + 11.625,03 = 13.494,00 EUR" },
          { nr: "3.5", punkte: 1.5, q: "Auf seinem Weg von Haiphong nach Rotterdam fährt das Schiff an mehreren Häfen vorbei. Geben Sie jeweils an, an welchem Meer diese Häfen liegen: a) Dschidda (Jeddah), b) Porto, c) Antwerpen!",
            loesung: "Je 0,5 Punkte: a) Dschidda – Rotes Meer · b) Porto – Atlantischer Ozean · c) Antwerpen – Nordsee (über die Schelde)." } ] },

      { nr: 4, punkte: 19.5, minuten: 35, anlage: "anl_lager",
        situation: "Sie arbeiten als Mitarbeiter der Donautal GmbH, Niederlassung Leipzig, in der Abteilung Warehouse und unterstützen Ihre Abteilungsleiterin bei der Ausarbeitung von Logistikverträgen. Derzeit sind Sie mit einem neuen Vertrag für den Kunden Gardeno GmbH beschäftigt. Die Gardeno GmbH stellt Gartengeräte her und vertreibt sie in Deutschland und Europa. Die Geschäftsleitung hat beschlossen, dass die Lagerung inklusive Verteilung der produzierten Geräte nicht mehr selbst, sondern durch einen Dienstleister erfolgen soll.",
        teile: [
          { nr: "4.1", punkte: 2, q: "Geben Sie 2 Teilbereiche der Logistik an, um die es sich in diesem Fall handelt, und begründen Sie jeweils, warum es sich um diesen Teilbereich handelt!",
            loesung: "Je 1 Punkt, zum Beispiel:\nLagerlogistik – die Donautal GmbH übernimmt Einlagerung, Bestandsführung und Kommissionierung der Fertigerzeugnisse.\nDistributionslogistik – die Verteilung der Geräte vom Lager zu den Kunden bzw. Vertriebsstandorten gehört zur Auslieferung der Fertigware.\nAuch zulässig: Kontraktlogistik als übergreifende Form mit langfristigem Vertrag und Mehrwertleistungen." },
          { nr: "4.2", punkte: 2, q: "Im Vertragsentwurf sind unter anderem folgende Leistungen genannt: Bestandsüberwachung, Inventur, Bestellannahme und Kommissionierung von Kleinteilen. Erklären Sie diese 4 Begriffe!",

          { nr: "4.3", punkte: 1.5, q: "Die Donautal GmbH plant, die Produkte nach dem Freiplatzsystem einzulagern. Erklären Sie, was dies bedeutet, geben Sie eine andere Bezeichnung für „Freiplatzsystem“ an und nennen Sie 1 Vorteil des Freiplatzsystems!",
            loesung: "Erklärung (0,5 Punkte): Jede Ware wird auf dem nächsten freien geeigneten Lagerplatz eingelagert; die Zuordnung wird in der Lagerverwaltung festgehalten.\nAndere Bezeichnung (0,5 Punkte): chaotische Lagerhaltung bzw. dynamische Lagerplatzvergabe.\nVorteil (0,5 Punkte): bessere Ausnutzung der Lagerkapazität, da keine Plätze für bestimmte Artikel freigehalten werden müssen." },
          { nr: "4.4", punkte: 1.5, q: "Die Auslagerung der Waren soll nach dem Lifo-Verfahren erfolgen. Geben Sie an, was Lifo ausgeschrieben bedeutet, und beschreiben Sie dieses Verfahren!",
            loesung: "Ausgeschrieben (0,5 Punkte): Last in – first out.\nBeschreibung (1 Punkt): Die zuletzt eingelagerte Ware wird zuerst ausgelagert. Typisch für Blocklager oder Einfahrregale, bei denen nur von einer Seite zugegriffen werden kann. Für verderbliche oder alternde Güter ist es ungeeignet." },
          { nr: "4.5", punkte: 2, q: "Mit der Gardeno GmbH ist ein Lagervertrag abgeschlossen worden. Nennen Sie die Rechtspositionen der Beteiligten und deren Hauptpflichten gemäß HGB!",
            loesung: "Rechtspositionen (je 0,5 Punkte): Die Donautal GmbH ist Lagerhalter, die Gardeno GmbH ist Einlagerer.\nHauptpflichten (je 0,5 Punkte): Der Lagerhalter schuldet die Lagerung und Aufbewahrung des Gutes (§ 467 HGB) einschließlich Obhut. Der Einlagerer schuldet die Zahlung des vereinbarten Lagergeldes." },
          { nr: "4.6", punkte: 3, q: "Der Vertrag enthält die Klausel: „Die Donautal GmbH stellt sicher, dass ein Lieferbereitschaftsgrad von 98 % erreicht wird. Bei Nichterreichen muss die Logistikabteilung der Gardeno GmbH informiert werden.“ a) Erklären Sie den Begriff Lieferbereitschaftsgrad! b) Entscheiden und begründen Sie rechnerisch, ob die Logistikabteilung nach Ablauf des ersten Monats informiert werden muss!",
            loesung: "a) (1 Punkt) Der Lieferbereitschaftsgrad gibt an, welcher Anteil der bestellten Mengen oder Aufträge termin- und mengengerecht aus dem Lagerbestand bedient werden konnte.\nb) (2 Punkte) 2.400 ausgelieferte : 2.482 bestellte Geräte × 100 = 96,70 %\n96,70 % < 98 % → der vereinbarte Lieferbereitschaftsgrad wurde nicht erreicht, die Logistikabteilung der Gardeno GmbH muss informiert werden." },
          { nr: "4.7", punkte: 5, q: "Im Vertrag wurde ein Angebotspreis für die Lagerhaltung von 14,50 EUR pro Gerät (= 1 Stellplatz) und Monat vereinbart. Nach einem Monat erfolgt eine Nachkalkulation. Prüfen Sie rechnerisch, ob der vereinbarte Preis die Kosten deckt und die Gewinnerwartungen erfüllt!",
            loesung: "Monatliche Kosten (2 Punkte):\nPersonal 92.160,00 : 12 = 7.680,00 EUR\nUmschlagsgeräte = 2.880,00 EUR\nGebäude und Verwaltung 72.000,00 : 12 = 6.000,00 EUR\nSumme = 16.560,00 EUR\nKosten je belegtem Stellplatz (1 Punkt): 16.560,00 : 650 = 25,48 EUR\nMit Gewinnzuschlag (1 Punkt): 25,48 × 1,10 = 28,03 EUR\nBeurteilung (1 Punkt): Der vereinbarte Preis von 14,50 EUR deckt weder die Selbstkosten von 25,48 EUR noch die Gewinnerwartung von 28,03 EUR. Je Stellplatz entsteht ein Verlust von rund 10,98 EUR; der Vertrag ist nachzuverhandeln oder die Auslastung muss deutlich steigen.\nHinweis: Rechnet man mit der Kapazität von 800 Stellplätzen, ergeben sich 20,70 EUR Selbstkosten – auch dann ist der Preis nicht auskömmlich." },
          { nr: "4.8", punkte: 2.5, q: "Die Geräte haben einen Wert von 1.500,00 EUR je Stück. a) Begründen Sie mithilfe des abgebildeten ADSp-Auszugs rechnerisch, wie hoch die Haftung der Donautal GmbH im Falle einer vollständigen Zerstörung der durchschnittlich gelagerten Ware durch ein Schadenereignis wäre! Gehen Sie von 12 kg je Gerät aus. b) Die Gardeno GmbH hat Ihnen den Wert der Geräte in einer E-Mail übermittelt und das Einverständnis zur Zuschlagszahlung gegeben. Begründen Sie, ob diese Art der Wertangabe ausreicht, damit die Haftungserhöhung greift!",
            loesung: "a) (1,5 Punkte) Durchschnittlich gelagert: 650 Geräte × 12 kg = 7.800 kg\n7.800 kg × 8,33 SZR = 64.974 SZR × 1,25 EUR = 81.217,50 EUR\nBegrenzung nach Ziffer 24.1.2: höchstens 35.000,00 EUR je Schadenfall → die Haftung beträgt 35.000,00 EUR.\nDer Warenwert von 650 × 1.500,00 = 975.000,00 EUR wird bei Weitem nicht gedeckt.\nb) (1 Punkt) Ziffer 24.2 verlangt die Wertangabe in Textform vor Einlagerung. Eine E-Mail erfüllt die Textform nach § 126b BGB. Die Angabe reicht aus, sofern sie vor der Einlagerung erfolgt ist und ein Zuschlag vereinbart wurde." } ] },

            loesung: "Zweck (0,75 Punkte): Waren werden nur vorübergehend in ein Drittland verbracht und unverändert wieder ausgeführt – hier Messegut für die SportsExpo in Lugano.\nVorteil (0,75 Punkte): vollständige Befreiung von Einfuhrabgaben im Bestimmungsland, keine Vorfinanzierung von Zoll und Einfuhrumsatzsteuer, vereinfachte Abwicklung an der Grenze.\nDokument (0,5 Punkte): Carnet ATA." },
          { nr: "2.2", punkte: 2, q: "Geben Sie an, welche Stelle dieses Dokument ausgibt und welche finanzielle Voraussetzung erforderlich ist!",
            loesung: "Ausgebende Stelle (1 Punkt): die zuständige Industrie- und Handelskammer.\nFinanzielle Voraussetzung (1 Punkt): Sicherheitsleistung bzw. Kaution in Höhe der im Bestimmungsland möglichen Einfuhrabgaben, meist als Bürgschaft oder Bardepot; zusätzlich fällt eine Ausstellungsgebühr an." },
          { nr: "2.3", punkte: 2, q: "Nennen Sie die Bedeutung der im Speditionsauftrag 2026/11/4471 genannten Incotermklausel in englischer und deutscher Sprache sowie den Kosten- und Gefahrenübergang!",
            loesung: "Englisch (0,5 Punkte): Delivered at Place Unloaded, Lugano.\nDeutsch (0,5 Punkte): Geliefert benannter Ort entladen, Lugano.\nKosten- und Gefahrenübergang (1 Punkt): Beide gehen erst über, wenn die Ware am benannten Ort in Lugano entladen zur Verfügung gestellt ist. Der Verkäufer trägt also Transport, Entladung und Risiko bis dorthin; die Einfuhrverzollung in der Schweiz übernimmt der Käufer." } ] },

      { nr: 3, punkte: 6, minuten: 12, anlage: "anl_maut",
        situation: "Die Fahrstrecke von Köln bis zur ersten Entladestelle beträgt 752 km. Die Durchschnittsgeschwindigkeit beträgt 64 km/h. Kalkulieren Sie mit einer normalen Tageslenkzeit und einer normalen Tagesruhezeit. Beim Verlassen der EU rechnen Sie mit 1 Stunde Aufenthalt an der Grenze.",
        teile: [
          { nr: "3.1", punkte: 3, q: "Ermitteln Sie, um wie viel Uhr der Fahrer spätestens starten muss, um den vorgegebenen Termin von 09:00 Uhr fix einzuhalten!",
            loesung: "Reine Fahrzeit (1 Punkt): 752 km : 64 km/h = 11,75 h = 11 h 45 min.\nUnterbrechungen (1 Punkt): Nach 4,5 h Lenkzeit je 45 min Pause. Bei 11 h 45 min Lenkzeit sind zwei Lenkzeitunterbrechungen fällig = 1 h 30 min. Die Tageslenkzeit von 9 h wird überschritten, also ist eine Tagesruhezeit von 11 h einzulegen (reduziert 9 h wäre zulässig; hier normale Ruhezeit).\nGrenzaufenthalt: 1 h.\nGesamtdauer (0,5 Punkte): 11 h 45 min + 1 h 30 min + 11 h + 1 h = 25 h 15 min.\nStartzeit (0,5 Punkte): 09:00 Uhr am Eintrefftag minus 25 h 15 min = 07:45 Uhr am Vortag." },
          { nr: "3.2", punkte: 3, q: "Nennen Sie 6 Dokumente, die der für diese Tour eingesetzte polnische Fahrer der Donautal GmbH auf dieser Tour mitführen muss!",
            loesung: "Je 0,5 Punkte, zum Beispiel: gültiger Führerschein mit Schlüsselzahl 95 · Personalausweis oder Reisepass · Fahrerkarte · Zulassungsbescheinigung Teil I · beglaubigte Abschrift der Gemeinschaftslizenz (EU-Lizenz) · CMR-Frachtbrief · Carnet ATA bzw. Zollpapiere für die Schweiz · Nachweis über die Entsendung (A1-Bescheinigung) · Nachweis des Arbeitsvertrags bzw. Fahrerentsendebescheinigung · bei Bedarf CEMT-Genehmigung." } ] },

      { nr: 4, punkte: 2, minuten: 5,
        situation: "Etwa 3 Stunden nach Abfahrt des Lkw ruft eine Mitarbeiterin der Whirlpool4you AG an und wünscht eine nachträgliche Verfügung: Die Sendung soll nicht mehr in Como, sondern in Mailand zugestellt werden.",
        teile: [
          { nr: "4.1", punkte: 2, q: "Prüfen Sie, unter welchen 4 Voraussetzungen dem Wunsch der Whirlpool4you AG entsprochen werden könnte!",
            loesung: "Je 0,5 Punkte:\n1. Die Verfügung muss vom Verfügungsberechtigten stammen – das ist bis zur Ablieferung der Absender (§ 418 HGB).\n2. Die Ausführung muss tatsächlich möglich sein und darf den Betrieb des Frachtführers nicht behindern; die Sendung darf noch nicht abgeliefert sein.\n3. Dem Empfänger der übrigen Sendungen und anderen Absendern dürfen keine Nachteile entstehen.\n4. Der Absender trägt die Mehrkosten und muss sie erstatten; der Frachtführer hat Anspruch auf angemessene Vergütung. Bei ausgestelltem Frachtbrief ist die Ausfertigung vorzulegen." } ] },

      { nr: 5, punkte: 5, minuten: 10,

        teile: [
          { nr: "5.1", punkte: 4, q: "Bringen Sie folgende Städte in die geografisch richtige Reihenfolge auf der Fahrt von Köln zur ersten Entladestelle: Basel, Darmstadt, Frankfurt am Main, Freiburg im Breisgau, Heidelberg, Karlsruhe, Luzern, Wiesbaden!",
            loesung: "Je 0,5 Punkte für die richtige Position:\nWiesbaden – Frankfurt am Main – Darmstadt – Heidelberg – Karlsruhe – Freiburg im Breisgau – Basel – Luzern.\nHinweis: Frankfurt und Wiesbaden können je nach gewähltem Autobahnkreuz tauschen; entscheidend ist die Nord-Süd-Folge über die Rheinschiene in die Schweiz." },
          { nr: "5.2", punkte: 1, q: "Geben Sie die beiden einstelligen Bundesautobahnen an, auf denen die Transportstrecke überwiegend innerhalb Deutschlands zurückgelegt wird!",
            loesung: "A 3 (Köln – Frankfurt am Main) und A 5 (Frankfurt am Main – Karlsruhe – Freiburg – Basel), je 0,5 Punkte." } ] },

      { nr: 6, punkte: 6, minuten: 12, anlage: "anl_sa2",
        situation: "Es kommt während des Transports zu einem Schadenfall. Dabei wird eine Holzkiste einschließlich der Ware aus dem Speditionsauftrag 2026/11/4466 komplett beschädigt. Nachforschungen ergeben, dass der Schaden bereits vor der Einfahrt in die Schweiz auf deutschem Staatsgebiet entstanden sein muss. Jede Kiste der Sendung hatte das gleiche Gewicht und den gleichen Wert. (1 SZR = 1,26 EUR)",
        teile: [
          { nr: "6.1", punkte: 1, q: "Nennen Sie die Art des Schadens, der hier vorliegt!",
            loesung: "Beschädigung (Substanzschaden) an einem Teil der Sendung – ein offener Güterschaden, kein Verlust und keine Lieferfristüberschreitung." },
          { nr: "6.2", punkte: 2, q: "Geben Sie begründet an, nach welcher Rechtsgrundlage gehaftet wird!",
            loesung: "CMR (1 Punkt): Es handelt sich um eine entgeltliche Güterbeförderung auf der Straße, Übernahmeort Deutschland und Ablieferungsort Italien bzw. Schweiz liegen in verschiedenen Staaten und Deutschland ist Vertragsstaat (Art. 1 CMR).\n(1 Punkt): Die Donautal GmbH tritt im Selbsteintritt als Frachtführer auf; die CMR gilt zwingend und geht den ADSp vor. Die Haftungsgrenze beträgt 8,33 SZR je Kilogramm (Art. 23 CMR)." },
          { nr: "6.3", punkte: 3, q: "Ermitteln Sie, ob die gesetzliche Haftung hier ausreichend ist, und berechnen Sie die Höhe des Schadenersatzes in EUR, den der Geschädigte erhält!",
            loesung: "Gewicht der beschädigten Kiste (0,5 Punkte): 16.200 kg : 6 = 2.700 kg.\nHaftungshöchstbetrag (1 Punkt): 2.700 kg × 8,33 SZR = 22.491 SZR × 1,26 EUR = 28.338,66 EUR.\nAnteiliger Warenwert (1 Punkt): 180.000,00 EUR : 6 = 30.000,00 EUR.\nBeurteilung und Ergebnis (0,5 Punkte): Der Haftungshöchstbetrag liegt unter dem Schaden, die gesetzliche Haftung reicht nicht aus. Ersetzt werden 28.338,66 EUR; es verbleibt eine Deckungslücke von 1.661,34 EUR. Eine Warentransportversicherung hätte den vollen Wert abgedeckt." } ] }
    ]

  {
    id: "sl_luft", traeger: "luft", titel: "Verkehrsträger Luftverkehr", punkte: 30,
    aufgaben: [
      { nr: 1, punkte: 7, minuten: 14, anlage: "anl_auftraege",
        situation: "Sie sind Mitarbeiter der Donautal GmbH und aktuell in der Abteilung Luftfracht am Flughafen Frankfurt am Main eingesetzt. Ihnen liegen insgesamt drei Kundenaufträge vor (siehe Anlage). Die Kunden wünschen, dass ihre Sendungen vom Flughafen Frankfurt am Main aus verflogen werden und die Anlieferung der Sendungen an die Airline durch Sie als Spediteur erfolgen soll.",
        teile: [
          { nr: "1.1", punkte: 3, q: "Geben Sie für die drei Aufträge an, wo sich jeweils der Kosten- und Gefahrenübergang befindet!",
            loesung: "Je 1 Punkt:\nAuftrag 1 – CPT Palo Alto: Gefahrenübergang bei Übergabe an den ersten Frachtführer in Deutschland, Kostenübergang erst in Palo Alto (Verkäufer zahlt die Fracht bis dorthin).\nAuftrag 2 – CIP San Francisco: ebenso Gefahrenübergang bei Übergabe an den ersten Frachtführer, Kostenübergang in San Francisco; zusätzlich muss der Verkäufer eine Versicherung nach ICC A über 110 % des Warenwerts eindecken.\nAuftrag 3 – DAP San Francisco: Kosten- und Gefahrenübergang fallen zusammen und erfolgen erst am benannten Bestimmungsort San Francisco, entladebereit auf dem ankommenden Beförderungsmittel." },
          { nr: "1.2", punkte: 4, q: "Die Donautal GmbH liefert die Sendungen luftfrachtsicher bei der Airline an. a) Nennen und begründen Sie 2 wesentliche Vorteile. b) Nennen Sie 2 Tätigkeiten, die dafür übernommen werden. c) Nennen Sie den erforderlichen Status und die Behörde, die ihn erteilt!",
            loesung: "a) Je 0,75 Punkte: Zeitvorteil – die Sendung muss am Flughafen nicht erst kontrolliert werden und erreicht den gebuchten Flug sicher. Kostenvorteil – teure Kontrollentgelte des Drittdienstleisters entfallen, zugleich entsteht ein Wettbewerbsvorteil gegenüber Spediteuren ohne Status. Außerdem: Schutz empfindlicher Güter, die eine Durchleuchtung nicht vertragen.\nb) Je 0,75 Punkte: Durchführung von Sicherheitskontrollen (Röntgen, Sprengstoffspürhund, andere zugelassene Verfahren) · Sicherung der Sendung gegen unbefugten Zugriff nach der Kontrolle · Schulung und Zuverlässigkeitsüberprüfung des Personals · Dokumentation des Sicherheitsstatus im Luftfrachtbrief.\nc) Status (0,5 Punkte): reglementierter Beauftragter (Regulated Agent).\nErteilt durch (0,5 Punkte): das Luftfahrt-Bundesamt (LBA)." } ] },

      { nr: 2, punkte: 9, minuten: 18, anlage: "anl_auftraege",
        situation: "Von den drei Versendern hat die Donautal GmbH den zusätzlichen Auftrag erhalten, die Exportorganisation zu übernehmen.",
        teile: [
          { nr: "2.1", punkte: 1, q: "Begründen Sie, welches Ausfuhrverfahren für den Kunden Baerbach Bautechnik AG (Auftrag 2) zur Anwendung kommt!",
            loesung: "Das zweistufige Ausfuhrverfahren: Der Warenwert von 6.000,00 EUR liegt über der Wertgrenze von 3.000,00 EUR, daher ist eine elektronische Ausfuhranmeldung bei der Ausfuhrzollstelle abzugeben; die Ausgangszollstelle am Flughafen überwacht den tatsächlichen Ausgang aus dem Zollgebiet der Union." },
          { nr: "2.2", punkte: 3, q: "Sie haben die elektronischen Ausfuhranmeldungen erstellt und an die Zollstelle übermittelt. Nennen Sie in der richtigen Reihenfolge 5 weitere Schritte, die im Rahmen des gesamten Ausfuhrverfahrens erfolgen!",
            loesung: "Je 0,6 Punkte, in dieser Reihenfolge:\n1. Die Ausfuhrzollstelle prüft die Anmeldung und überlässt die Ware zur Ausfuhr.\n2. Das Ausfuhrbegleitdokument (ABD) mit MRN wird übermittelt und ausgedruckt.\n3. Die Ware wird mit dem ABD der Ausgangszollstelle am Flughafen gestellt.\n4. Die Ausgangszollstelle überwacht den körperlichen Ausgang und bestätigt ihn elektronisch.\n5. Die Ausfuhrzollstelle erstellt den Ausgangsvermerk als Nachweis für die Umsatzsteuerbefreiung und übermittelt ihn dem Anmelder." },
          { nr: "2.3", punkte: 2.5, q: "Die Donautal GmbH soll die drei Versender bei der Zollanmeldung vertreten, möchte jedoch nicht Inhaberin des Zollverfahrens und nicht selbst Anmelderin sein. Unterscheiden Sie die direkte und die indirekte Vertretung und geben Sie an, welche Art die Donautal GmbH wählen sollte!",
            loesung: "Direkte Vertretung (1 Punkt): Der Vertreter handelt im Namen und für Rechnung des Vertretenen. Anmelder und Zollschuldner ist allein der Versender; der Spediteur haftet nicht für die Abgaben.\nIndirekte Vertretung (1 Punkt): Der Vertreter handelt im eigenen Namen, aber für Rechnung des Vertretenen. Er wird selbst Anmelder und neben dem Vertretenen Zollschuldner.\nEmpfehlung (0,5 Punkte): die direkte Vertretung, da die Donautal GmbH ausdrücklich nicht Anmelderin und nicht Verfahrensinhaberin werden will." },
          { nr: "2.4", punkte: 2.5, q: "Im Rahmen der Exportorganisation ist zu klären, ob die Waren ausgeführt werden dürfen. a) Nennen Sie die Behörde, die für die Erteilung einer Ausfuhrgenehmigung von Deutschland in die USA zuständig ist! b) Erläutern Sie den Begriff „Dual-Use-Güter“! c) Geben Sie an, wofür die Abkürzung „VuB“ steht, und erläutern Sie 2 Ziele, die damit verfolgt werden!",
            loesung: "a) (0,5 Punkte) Bundesamt für Wirtschaft und Ausfuhrkontrolle (BAFA).\nb) (1 Punkt) Güter mit doppeltem Verwendungszweck: Sie sind für zivile Zwecke bestimmt, lassen sich aber auch militärisch oder für Rüstungszwecke einsetzen – etwa die Rüttelplatte, wenn sie militärisch genutzt werden kann. Sie unterliegen der Ausfuhrgenehmigungspflicht nach der EU-Dual-Use-Verordnung.\nc) (1 Punkt) VuB steht für Verbote und Beschränkungen. Ziele, je 0,5 Punkte: Schutz der öffentlichen Sicherheit und Ordnung · Schutz von Gesundheit, Leben und Umwelt (hier: Tierfuttermehl, veterinärrechtliche Kontrolle) · Einhaltung von Embargos und Sanktionen · Schutz des Artenschutzes und des Kulturguts." } ] },

      { nr: 3, punkte: 4, minuten: 8,
        situation: "Für die Organisation des Transports planen Sie, die drei Sendungen als Consolidation abzufertigen.",
        teile: [
          { nr: "3.1", punkte: 2, q: "Erläutern Sie 2 Vorteile, den die Abfertigung als Consolidation für die Donautal GmbH hat!",
            loesung: "Je 1 Punkt: Durch das höhere Gesamtgewicht greift eine niedrigere Gewichtsstufe im Tarif; die Differenz zwischen der günstigen Einkaufsrate und den Einzelraten der Kunden bleibt als Marge beim Spediteur.\nWeitere: nur ein Master Air Waybill und eine Abfertigung bei der Airline, dadurch weniger Verwaltungsaufwand und bessere Verhandlungsposition gegenüber dem Carrier; bessere Auslastung gebuchter Kapazität." },
          { nr: "3.2", punkte: 2, q: "Für die Consolidation erstellt die Donautal GmbH einen Master Air Waybill (MAWB). Geben Sie an, wer als Empfänger einzutragen ist und welches Vertragsverhältnis der MAWB generell dokumentiert!",
            loesung: "Empfänger (1 Punkt): der Empfangsspediteur bzw. Korrespondenzspediteur am Zielflughafen – hier die Forwarding California Ltd., San Francisco, nicht die einzelnen Warenempfänger.\nVertragsverhältnis (1 Punkt): Der MAWB dokumentiert den Luftfrachtvertrag zwischen dem Spediteur (als Versender der Sammelsendung) und der Airline. Das Verhältnis zwischen Spediteur und einzelnem Kunden wird im House Air Waybill (HAWB) dokumentiert." } ] },

function heuteStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

function lokalLesen() {
  try { const r = localStorage.getItem(SPEICHER_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function lokalSchreiben() {
  try { localStorage.setItem(SPEICHER_KEY, JSON.stringify(F)); } catch (e) { /* privater Modus */ }
}
function sichern() {
  F.stand = Date.now();
  lokalSchreiben();
  if (speicherTimer) clearTimeout(speicherTimer);
  speicherTimer = setTimeout(async () => {
    speicherTimer = null;
    if (!dbRef) return;
    try { await dbRef.set(JSON.parse(JSON.stringify(F))); } catch (e) { /* lokal bleibt erhalten */ }
  }, 1200);
}

async function geraeteAbgleich() {
  try {
    const nutzer = await (window.claude && window.claude.use ? window.claude.use("user") : null);
    const db = await (window.claude && window.claude.use ? window.claude.use("db") : null);
    if (!db || !nutzer) return;
    const uid = await nutzer.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/fortschritt");
    const schnapp = await dbRef.get();
    if (schnapp.exists) {
      const fern = schnapp.data();
      if (fern && typeof fern.stand === "number" && fern.stand > (F.stand || 0)) {
        F = Object.assign(leerFortschritt(), fern);
        lokalSchreiben();
        zeichne();
      } else if ((F.stand || 0) > 0) {
        await dbRef.set(JSON.parse(JSON.stringify(F)));
      }
    } else if ((F.stand || 0) > 0) {
      await dbRef.set(JSON.parse(JSON.stringify(F)));
    }
    syncHinweis(true);
  } catch (e) { /* ohne Abgleich weiterarbeiten */ }
}

function syncHinweis(an) {
  const n = document.getElementById("sync-hinweis");
  if (n) n.textContent = an ? "Fortschritt wird geräteübergreifend gesichert." : "Fortschritt wird nur in diesem Browser gespeichert.";
}

}
function zuZahl(s) {
  let t = String(s === undefined || s === null ? "" : s).replace(/\s/g, "").replace(/[^0-9.,\-]/g, "");
  if (t.indexOf(",") >= 0) t = t.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(t);
  return isFinite(n) ? n : NaN;
}
function mische(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
/* Antwortreihenfolge je Durchlauf neu mischen, damit die Position nichts verrät */
function mischOptionen(f) {
  const p = mische(f.o.map((_, i) => i));
  return { id: f.id, t: f.t, q: f.q, e: f.e, o: p.map(i => f.o[i]), a: p.indexOf(f.a) };
}
const thema = id => THEMEN.find(t => t.id === id);
const bereichVon = themaId => { const t = thema(themaId); return t ? t.b : null; };
const bereich = id => BEREICHE.find(b => b.id === id);

/* ===================== Lernstand ===================== */
function karteFaellig(id) {
  const k = F.karten[id];
  if (!k) return true;
  return (k.faellig || 0) <= Date.now();
}
function faelligeKarten(themaFilter) {
  return KARTEN.filter(k => (themaFilter === "alle" || k.t === themaFilter) && karteFaellig(k.id));
}
function karteBewerten(id, gewusst) {
  const k = F.karten[id] || { box: 1, faellig: 0 };
  k.box = gewusst ? Math.min(5, (k.box || 1) + 1) : 1;
  k.faellig = Date.now() + BOX_TAGE[k.box - 1] * TAG_MS;
  F.karten[id] = k;
  const h = heuteStr();
  if (F.heute.datum !== h) F.heute = { datum: h, karten: 0 };
  F.heute.karten += 1;
  if (F.letzterLerntag !== h) {
    const gestern = new Date(Date.now() - TAG_MS);
    const gStr = gestern.getFullYear() + "-" + String(gestern.getMonth() + 1).padStart(2, "0") + "-" + String(gestern.getDate()).padStart(2, "0");
    F.serie = F.letzterLerntag === gStr ? (F.serie || 0) + 1 : 1;
    F.letzterLerntag = h;
  }
  sichern();
}
function frageBewerten(id, richtig) {
  const f = F.fragen[id] || { g: 0, r: 0, f: 0, lr: null };
  f.g += 1;
  if (richtig) { f.r += 1; f.lr = true; } else { f.f += 1; f.lr = false; }
  F.fragen[id] = f;
  sichern();
}

function bereichsStand(bid) {
  const themen = THEMEN.filter(t => t.b === bid).map(t => t.id);
  const karten = KARTEN.filter(k => themen.indexOf(k.t) >= 0);
  const fragen = FRAGEN.filter(q => themen.indexOf(q.t) >= 0);
  const rechnen = RECHNEN.filter(r => themen.indexOf(r.t) >= 0);
  const kSicher = karten.filter(k => (F.karten[k.id] || {}).box >= 4).length;
  const qSicher = fragen.concat(rechnen).filter(q => (F.fragen[q.id] || {}).lr === true).length;
  const gesamt = karten.length + fragen.length + rechnen.length;
  return {
    karten: karten.length, kartenSicher: kSicher,
    fragen: fragen.length + rechnen.length, fragenSicher: qSicher,
    faellig: karten.filter(k => karteFaellig(k.id)).length,
    prozent: gesamt ? Math.round((kSicher + qSicher) / gesamt * 100) : 0
  };
}

function tageBisPruefung() {
  if (!F.termin) return null;
  const ziel = new Date(F.termin + "T00:00:00");
  if (isNaN(ziel.getTime())) return null;
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  return Math.round((ziel - heute) / TAG_MS);
}

/* ===================== Navigation ===================== */
function wechsle(name) {
  S.ansicht = name;

function designAnwenden() {
  const d = (F.design = Object.assign({ modus: "system", akzent: "verkehrsblau", stil: "terminal", grund: "design" }, F.design));
  const r = document.documentElement;
  if (d.modus === "hell" || d.modus === "dunkel") r.setAttribute("data-modus", d.modus);
  else r.removeAttribute("data-modus");
  r.setAttribute("data-akzent", d.akzent);
  r.setAttribute("data-stil", d.stil);
  if (d.grund && d.grund !== "design") r.setAttribute("data-grund", d.grund);
  else r.removeAttribute("data-grund");
}

/* Zeigt die Seite gerade dunkel? Entscheidet, wie die Farbproben gezeichnet werden. */
function dunkelAktiv() {
  const m = F.design ? F.design.modus : "system";
  if (m === "dunkel") return true;
  if (m === "hell") return false;
  const host = document.documentElement.getAttribute("data-theme");
  if (host === "dark") return true;
  if (host === "light") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}

/* Hintergrund-Probe: zeigt den Ton als kleine Seitenvorschau mit Textbalken,
   sonst wären die hellen Töne auf der weißen Karte kaum zu erkennen. */
function grundProbe(g) {
  let h = g.h, s = g.s;
  if (g.id === "design") { const papier = F.design.stil === "frachtbrief"; h = papier ? 36 : 210; s = papier ? 16 : 14; }
  if (g.id === "akzent") { const a = AKZENTE.find(x => x.id === F.design.akzent) || AKZENTE[0]; h = a.h; s = 12; }
  const dunkel = dunkelAktiv();
  const rund = x => Math.round(x * 10) / 10;
  const flaeche = "hsl(" + h + " " + rund(dunkel ? s * 1.2 : s) + "% " + (dunkel ? 14.5 : 94) + "%)";
  const schrift = "hsl(" + h + " " + rund(dunkel ? s * 1.4 : s * 1.6) + "% " + (dunkel ? 93 : 12) + "%)";
  return "linear-gradient(" + schrift + " 0 34%, " + flaeche + " 34% 100%)";
}
