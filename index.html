/* ---------- Seekarten ---------- */
/* Zeichnet die Weltkarte, bei Meerengen als Ausschnitt um die Engstelle.
   Alle Maße hängen an der Fensterbreite, damit Linien und Schrift bei jedem Zoom gleich wirken. */
function seeSvg(schluessel, breite) {
  const b = breite || 300;
  const punkt = SEE_PUNKTE[schluessel];
  let fx, fy, fw, fh;
  if (punkt) {
    fw = SEE_FENSTER[schluessel] || 40;
    fh = fw * 0.62;
    fx = Math.max(0, Math.min(WELT_MASS[0] - fw, punkt[1] - fw / 2));
    fy = Math.max(0, Math.min(WELT_MASS[1] - fh, punkt[2] - fh / 2));
  } else {
    fx = 0; fy = 0; fw = WELT_MASS[0]; fh = WELT_MASS[1];
  }
  const e = fw / b;                      /* eine Bildschirmeinheit in Kartenmaß */
  const schrift = (10 * e).toFixed(2);
  const dick = (2.6 * e).toFixed(2);
  const punktR = (4 * e).toFixed(2);

  let inhalt = '<rect x="' + fx + '" y="' + fy + '" width="' + fw + '" height="' + fh + '" style="fill:var(--signal-weich)"/>' +
    '<path d="' + WELT_UMRISS + '" style="fill:var(--flaeche);stroke:var(--linie-stark);stroke-width:' +
    (0.9 * e).toFixed(2) + ';stroke-linejoin:round"/>';

  if (!punkt) {
    const wege = schluessel === "wege"
      ? ["asien_europa", "transpazifik", "transpazifik2", "transatlantik"]
      : (schluessel === "kap" ? ["kap_route", "asien_europa"] : []);
    wege.forEach(w => {
      const ps = SEE_ROUTEN[w];
      inhalt += '<polyline points="' + ps.map(p => p[0] + "," + p[1]).join(" ") + '" fill="none" ' +
        'style="stroke:var(--signal);stroke-width:' + dick + ';stroke-linejoin:round;stroke-linecap:round"/>';
      /* Endpunkte markieren, sonst wirken zwei Routen über Land wie eine durchgehende Linie */
      [ps[0], ps[ps.length - 1]].forEach(p => {
        inhalt += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (3.2 * e).toFixed(2) + '" ' +
          'style="fill:var(--flaeche);stroke:var(--signal);stroke-width:' + (1.8 * e).toFixed(2) + '"/>';
      });
    });
    if (schluessel === "ozeane") {
      SEE_OZEANE.forEach(o => {
        inhalt += '<text x="' + o[1] + '" y="' + o[2] + '" text-anchor="middle" ' +
          'style="font-family:var(--schrift-text);font-size:' + schrift + 'px;font-weight:600;fill:var(--signal-text);' +
          'stroke:var(--signal-weich);stroke-width:' + (3 * e).toFixed(2) + ';paint-order:stroke fill">' + esc(o[0]) + "</text>";
      });
    } else {
      /* Auf der Routenkarte nur die vier Punkte beschriften, die auf den Wegen liegen */
      const marken = schluessel === "wege" ? ["panama", "gibraltar", "suez", "malakka"] : Object.keys(SEE_PUNKTE);
      inhalt += seeMarken(marken, e, schrift, punktR, 1);
    }
  } else {
    inhalt += seeMarken([schluessel], e, schrift, punktR, 1);
  }

  return '<svg viewBox="' + [fx, fy, fw, fh].join(" ") + '" width="' + b + '" height="' + Math.round(b * fh / fw) + '" ' +
    'style="max-width:100%;height:auto" role="img" aria-label="Lage: ' +
    esc(punkt ? punkt[0] : "Seewege und Weltmeere") + '">' + inhalt + "</svg>";
}

/* Markierungen mit Beschriftung, die einander senkrecht ausweichen */
function seeMarken(schluessel, e, schrift, punktR, deckung) {
  const belegt = [];
  let aus = "";
  schluessel.forEach(s => {
    const p = SEE_PUNKTE[s];
    if (!p) return;
    const name = p[0], x = p[1];
    const rechts = x < WELT_MASS[0] * 0.75;
    const weite = (name.length * 5.4 + 8) * e;
    const x1 = rechts ? x : x - weite, x2 = rechts ? x + weite : x;
    let y = p[2] + 3.4 * e;
    for (let versuch = 0; versuch < 6; versuch++) {
      const stoert = belegt.some(k => x1 < k.x2 && x2 > k.x1 && Math.abs(y - k.y) < 11 * e);
      if (!stoert) break;
      y = p[2] + 3.4 * e + (versuch % 2 === 0 ? 1 : -1) * 12 * e * Math.ceil((versuch + 1) / 2);
    }
    belegt.push({ x1: x1, x2: x2, y: y });
    aus += '<circle cx="' + x + '" cy="' + p[2] + '" r="' + punktR + '" ' +
      'style="fill:var(--signal);stroke:var(--flaeche);stroke-width:' + (1.4 * e).toFixed(2) + ';opacity:' + deckung + '"/>' +
      '<text x="' + (x + (rechts ? 6 * e : -6 * e)) + '" y="' + y + '" text-anchor="' + (rechts ? "start" : "end") + '" ' +
      'style="font-family:var(--schrift-text);font-size:' + schrift + 'px;font-weight:600;fill:var(--text);' +
      'stroke:var(--flaeche);stroke-width:' + (3 * e).toFixed(2) + ';paint-order:stroke fill;opacity:' + deckung + '">' +
      esc(name) + "</text>";
  });
  return aus;
}

/* Übersichtskarte unter der Nachschlagetabelle */
function seeTafel() {
  return '<div class="karte-leib"><div class="seetafel">' + seeSvg("uebersicht", 760) +
    '<p class="hinweis">Alle Engstellen auf einen Blick. Küstenlinien aus dem gemeinfreien Datensatz Natural Earth.</p></div></div>';
}

/* ---------- Autobahnkarten ---------- */
/* Zeichnet den Umriss Deutschlands und darin den Verlauf einer Autobahn.
   Inline-SVG, weil veröffentlichte Seiten keine externen Bilder laden dürfen. */
function babSvg(nr, breite) {
  const teile = BAB_ROUTEN[nr] ? [nr] : Object.keys(BAB_ROUTEN).filter(k => k.indexOf(nr) === 0);
  if (!teile.length) return "";
  const b = breite || 150;
  const mitOrten = b >= 140 && BAB_ORTE[nr];
  let linien = "", enden = "", orte = "";
  teile.forEach(t => {
    const ps = BAB_ROUTEN[t];
    linien += '<polyline points="' + ps.map(p => p[0] + "," + p[1]).join(" ") + '" fill="none" ' +
      'style="stroke:var(--signal);stroke-width:5;stroke-linejoin:round;stroke-linecap:round"/>';
    [ps[0], ps[ps.length - 1]].forEach(p => {
      enden += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" ' +
        'style="fill:var(--flaeche);stroke:var(--signal);stroke-width:2.5"/>';
    });
  });
  if (mitOrten) {
    /* Beschriftungen weichen senkrecht aus, wenn sie sich sonst überlagern
       (betrifft vor allem die West-Ost-Autobahnen). */
    const belegt = [];
    BAB_ORTE[nr].forEach(o => {
      const name = o[0], x = o[1];
      const rechts = x < 100;
      const weite = name.length * 5.1 + 7;
      const x1 = rechts ? x : x - weite, x2 = rechts ? x + weite : x;
      let y = o[2] + 3.2;
      for (let versuch = 0; versuch < 6; versuch++) {
        const stoert = belegt.some(b => x1 < b.x2 && x2 > b.x1 && Math.abs(y - b.y) < 9.5);
        if (!stoert) break;
        y = o[2] + 3.2 + (versuch % 2 === 0 ? 1 : -1) * 10.5 * Math.ceil((versuch + 1) / 2);
      }
      belegt.push({ x1: x1, x2: x2, y: y });
      orte += '<circle cx="' + x + '" cy="' + o[2] + '" r="2.6" style="fill:var(--text)"/>' +
        (Math.abs(y - o[2] - 3.2) > 1
          ? '<line x1="' + x + '" y1="' + o[2] + '" x2="' + (x + (rechts ? 5 : -5)) + '" y2="' + (y - 3) + '" ' +
            'style="stroke:var(--linie-stark);stroke-width:0.9"/>'
          : "") +
        '<text x="' + (x + (rechts ? 6 : -6)) + '" y="' + y + '" text-anchor="' + (rechts ? "start" : "end") + '" ' +
        'style="font-family:var(--schrift-text);font-size:9.5px;font-weight:600;fill:var(--text);' +
        'stroke:var(--flaeche2);stroke-width:3;paint-order:stroke fill">' + esc(name) + "</text>";
    });
  }
  return '<svg viewBox="0 0 200 260" width="' + b + '" height="' + Math.round(b * 1.3) + '" ' +
    'role="img" aria-label="Verlauf der ' + nr + ' auf der Karte von Deutschland">' +
    '<path d="' + DE_UMRISS + '" style="fill:var(--flaeche2);stroke:var(--linie-stark);stroke-width:1.2;stroke-linejoin:round"/>' +
    linien + orte + enden + "</svg>";
}

/* Tafel mit allen neun Autobahnen, unter der Nachschlagetabelle */

}

/* ===================== Lernkarten ===================== */
function rKarten() {
  if (!S.lern.stapel.length) {
    const f = faelligeKarten(S.lern.thema);
    S.lern.stapel = f.length ? mische(f) : mische(KARTEN.filter(k => S.lern.thema === "alle" || k.t === S.lern.thema));
    S.lern.aufgedeckt = false;
  }
  const karte = S.lern.stapel[0];
  const offen = faelligeKarten(S.lern.thema).length;
  let html = '<div class="karte"><div class="karte-leib stapel">' +
    '<div class="reihe">' + themenAuswahl("karten-thema", S.lern.thema) +
    '<div class="kennzahl" style="margin-left:auto"><b class="zahl">' + offen + '</b><span>fällig</span></div></div></div></div>';

  if (!karte) {
    html += '<div class="karte"><div class="karte-leib"><p>Für dieses Thema sind keine Karten hinterlegt.</p></div></div>';
    $("#v-karten").innerHTML = html;
    $("#karten-thema").addEventListener("change", e => { S.lern.thema = e.target.value; S.lern.stapel = []; rKarten(); });
    return;
  }

  const bild = karte.bab ? babSvg(karte.bab, 196) : (karte.meer ? seeSvg(karte.meer, 320) : "");
  const stand = F.karten[karte.id];
  const box = stand ? stand.box : 1;
  html += '<div class="karte lernkarte" id="lern-karte" tabindex="0" role="button" aria-label="Karte aufdecken">' +
    '<div class="reihe" style="justify-content:center"><span class="chip signal">' + esc(thema(karte.t).name) + '</span><span class="chip">Box ' + box + ' von 5</span></div>' +
    '<div class="vorn">' + esc(karte.v) + "</div>" +
    (S.lern.aufgedeckt
      ? (bild
          ? '<div class="mit-bild">' + bild + '<div class="hinten">' + esc(karte.h) + "</div></div>"
          : '<div class="hinten">' + esc(karte.h) + "</div>")
      : (bild
          ? '<div class="tipp">Tippen oder Leertaste zum Aufdecken – mit Kartenbild</div>'
          : '<div class="tipp">Tippen oder Leertaste zum Aufdecken</div>')) +
    "</div>";

  if (S.lern.aufgedeckt) {
    html += '<div class="kartenleiste">' +
      '<button class="knopf leise" data-k="nochmal">Nochmal üben</button>' +
      '<button class="knopf" data-k="gewusst">Gewusst</button>' +
      '</div><p class="hinweis" style="text-align:center">„Gewusst“ schiebt die Karte eine Box weiter: Wiederholung nach 1, 3, 7 und 16 Tagen.</p>';
  }
  $("#v-karten").innerHTML = html;

  $("#karten-thema").addEventListener("change", e => { S.lern.thema = e.target.value; S.lern.stapel = []; rKarten(); });
  const kn = $("#lern-karte");
  kn.addEventListener("click", () => { if (!S.lern.aufgedeckt) { S.lern.aufgedeckt = true; rKarten(); } });
  alle("[data-k]", $("#v-karten")).forEach(b => b.addEventListener("click", () => {
    karteBewerten(karte.id, b.dataset.k === "gewusst");
    S.lern.stapel.shift();
    if (b.dataset.k === "nochmal") S.lern.stapel.push(karte);
    S.lern.aufgedeckt = false;
    rKarten();
  }));
}

/* ===================== Quiz ===================== */
function quizPool(themaId) {
  return FRAGEN.filter(q => themaId === "alle" || q.t === themaId);
}
function quizStart() {
  const pool = quizPool(S.quiz.thema);
  const unsicher = pool.filter(q => (F.fragen[q.id] || {}).lr !== true);
  const basis = unsicher.length >= S.quiz.laenge ? unsicher : unsicher.concat(mische(pool.filter(q => (F.fragen[q.id] || {}).lr === true)));
  S.quiz.liste = mische(basis).slice(0, Math.min(S.quiz.laenge, pool.length)).map(mischOptionen);
  S.quiz.idx = 0; S.quiz.gewaehlt = null; S.quiz.richtig = 0; S.quiz.fertig = false;
}
function rQuiz() {
  if (!S.quiz.liste.length) quizStart();
  if (!S.quiz.liste.length) {
    $("#v-quiz").innerHTML = '<div class="karte"><div class="karte-leib"><p>Fuer dieses Thema sind keine Fragen hinterlegt.</p></div></div>';
    return;
  }
  let html = '<div class="karte"><div class="karte-leib reihe">' + themenAuswahl("quiz-thema", S.quiz.thema) +
    '<label class="feld" style="max-width:120px"><span>Fragen</span><select id="quiz-laenge">' +
    [5, 10, 20, 30].map(n => '<option value="' + n + '"' + (n === S.quiz.laenge ? " selected" : "") + ">" + n + "</option>").join("") +
    '</select></label><button class="knopf leise klein" id="quiz-neu" style="margin-top:auto">Neuer Satz</button></div></div>';

  if (S.quiz.fertig) {
    const q = S.quiz.liste.length;
    const p = Math.round(S.quiz.richtig / Math.max(1, q) * 100);
    html += '<div class="karte"><div class="karte-leib stapel"><h2>' + S.quiz.richtig + " von " + q + " richtig</h2>" +
      '<div class="balken"><i class="' + (p >= 50 ? "gut" : "") + '" style="width:' + Math.max(2, p) + '%"></i></div>' +
      "<p>" + p + " % – " + esc(noteZuPunkten(p).text) + '</p>' +
      '<div class="reihe"><button class="knopf" id="quiz-wieder">Nächster Satz</button>' +
      '<button class="knopf leise" data-zu="karten">Zu den Karten</button></div></div></div>';
    $("#v-quiz").innerHTML = html;
    bindQuizKopf();
    $("#quiz-wieder").addEventListener("click", () => { quizStart(); rQuiz(); });
    $('[data-zu="karten"]').addEventListener("click", () => wechsle("karten"));
    return;
  }

  const frage = S.quiz.liste[S.quiz.idx];
  const gewaehlt = S.quiz.gewaehlt;
  html += '<div class="karte"><div class="karte-kopf">' +
    '<span class="feldname">Frage ' + (S.quiz.idx + 1) + " von " + S.quiz.liste.length + '</span>' +
    '<span class="chip signal">' + esc(thema(frage.t).name) + '</span>' +
    '<span class="chip" style="margin-left:auto">' + esc(bereich(bereichVon(frage.t)).kurz) + '</span></div>' +
    '<div class="karte-leib stapel"><h3>' + esc(frage.q) + "</h3><div class=\"stapel\" style=\"gap:8px\">";
  frage.o.forEach((o, i) => {
    let stand = "";
    if (gewaehlt !== null) {
      if (i === frage.a) stand = ' data-stand="richtig"';
      else if (i === gewaehlt) stand = ' data-stand="falsch"';
    }
    html += '<button class="option" data-opt="' + i + '"' + stand + (gewaehlt !== null ? " disabled" : "") + '>' +
      '<span class="marke-opt">' + "ABCD"[i] + "</span><span>" + esc(o) + "</span></button>";
  });
  html += "</div>";
  if (gewaehlt !== null) {
    html += '<div class="loesungsblock"><b>' + (gewaehlt === frage.a ? "Richtig" : "Richtig ist " + "ABCD"[frage.a]) + "</b>" + esc(frage.e) + "</div>" +
      '<div class="reihe"><button class="knopf" id="quiz-weiter">' + (S.quiz.idx + 1 < S.quiz.liste.length ? "Weiter" : "Ergebnis") + "</button></div>";
  } else {
    html += '<p class="hinweis">Antwort mit Klick oder Taste 1–4 wählen.</p>';
  }
  html += "</div></div>";
  $("#v-quiz").innerHTML = html;
  bindQuizKopf();
  alle("[data-opt]", $("#v-quiz")).forEach(b => b.addEventListener("click", () => quizAntwort(parseInt(b.dataset.opt, 10))));
  const w = $("#quiz-weiter");
  if (w) w.addEventListener("click", quizWeiter);
}
function bindQuizKopf() {
  $("#quiz-thema").addEventListener("change", e => { S.quiz.thema = e.target.value; quizStart(); rQuiz(); });
  $("#quiz-laenge").addEventListener("change", e => { S.quiz.laenge = parseInt(e.target.value, 10); quizStart(); rQuiz(); });
  $("#quiz-neu").addEventListener("click", () => { quizStart(); rQuiz(); });
}
function quizAntwort(i) {
  if (S.quiz.gewaehlt !== null) return;
  const frage = S.quiz.liste[S.quiz.idx];
  S.quiz.gewaehlt = i;
  const richtig = i === frage.a;
  if (richtig) S.quiz.richtig += 1;
  frageBewerten(frage.id, richtig);
  rQuiz();
}
function quizWeiter() {
  if (S.quiz.idx + 1 < S.quiz.liste.length) { S.quiz.idx += 1; S.quiz.gewaehlt = null; }
  else S.quiz.fertig = true;
  rQuiz();
}

/* ===================== Rechnen ===================== */
function rRechnen() {
  let html = '<div class="karte"><div class="karte-leib reihe">' +
    '<button class="knopf' + (S.rechnen.reiter === "aufgaben" ? "" : " leise") + ' klein" data-rr="aufgaben">Aufgaben</button>' +
    '<button class="knopf' + (S.rechnen.reiter === "rechner" ? "" : " leise") + ' klein" data-rr="rechner">Rechner</button>' +
    '</div></div>';
  html += S.rechnen.reiter === "aufgaben" ? aufgabenHtml() : rechnerHtml();
  $("#v-rechnen").innerHTML = html;
  alle("[data-rr]", $("#v-rechnen")).forEach(b => b.addEventListener("click", () => { S.rechnen.reiter = b.dataset.rr; rRechnen(); }));
  if (S.rechnen.reiter === "aufgaben") bindAufgaben(); else bindRechner();
}

function aufgabenHtml() {
  if (!S.rechnen.liste.length) {
    const offen = RECHNEN.filter(r => (F.fragen[r.id] || {}).lr !== true);
    S.rechnen.liste = mische(offen.length ? offen : RECHNEN);
    S.rechnen.idx = 0; S.rechnen.geprueft = false;
  }
  const a = S.rechnen.liste[S.rechnen.idx % S.rechnen.liste.length];
  const geloest = RECHNEN.filter(r => (F.fragen[r.id] || {}).lr === true).length;
  let html = '<div class="karte"><div class="karte-kopf">' +
    '<span class="feldname">Rechenaufgabe</span><span class="chip signal">' + esc(thema(a.t).name) + '</span>' +
    '<span class="chip" style="margin-left:auto">' + geloest + " von " + RECHNEN.length + " gelöst</span></div>" +
    '<div class="karte-leib stapel"><h3>' + esc(a.q) + "</h3>" +
    '<div class="reihe"><label class="feld" style="max-width:220px"><span>Ergebnis in ' + esc(a.eh) + '</span>' +
    '<input type="text" inputmode="decimal" id="rechen-eingabe" placeholder="z. B. 1234,56"' + (S.rechnen.geprueft ? " disabled" : "") + '></label>' +
    (S.rechnen.geprueft ? "" : '<button class="knopf" id="rechen-pruefen" style="margin-top:auto">Prüfen</button>') + "</div>";
  if (S.rechnen.geprueft) {
    html += '<div class="loesungsblock"><b>' + (S.rechnen.korrekt ? "Richtig" : "Noch nicht richtig") + "</b>" +
      "Ergebnis: <span class=\"zahl\">" + zahl(a.a, a.a % 1 === 0 ? 0 : 2) + " " + esc(a.eh) + "</span><br>" + esc(a.w) + "</div>" +
      '<div class="reihe"><button class="knopf" id="rechen-weiter">Nächste Aufgabe</button></div>';
  } else {
    html += '<p class="hinweis">Komma oder Punkt sind beide zulässig. Zwischenschritte wie gewohnt auf Papier – hier zählt das Endergebnis.</p>';
  }
  html += "</div></div>";
  return html;
}
function bindAufgaben() {
  const a = S.rechnen.liste[S.rechnen.idx % S.rechnen.liste.length];
  const feld = $("#rechen-eingabe");
  const pruef = $("#rechen-pruefen");
  if (pruef) {
    const los = () => {
      const v = zuZahl(feld.value);
      if (!isFinite(v)) { feld.focus(); return; }
      S.rechnen.korrekt = Math.abs(v - a.a) <= (a.tol || 0.01);
      S.rechnen.geprueft = true;
      frageBewerten(a.id, S.rechnen.korrekt);
      rRechnen();
    };
    pruef.addEventListener("click", los);
    feld.addEventListener("keydown", e => { if (e.key === "Enter") los(); });
    feld.focus();
  }
  const w = $("#rechen-weiter");
  if (w) w.addEventListener("click", () => {
    S.rechnen.idx += 1; S.rechnen.geprueft = false;
    if (S.rechnen.idx >= S.rechnen.liste.length) S.rechnen.liste = [];
    rRechnen();
  });
}

/* ---- Rechner ---- */
const RECHNER = [
  { id:"rc_strasse", titel:"Frachtpflichtiges Gewicht – Straße",
    felder:[["anz","Packstücke","6",1],["l","Länge (cm)","120",1],["b","Breite (cm)","80",1],["h","Höhe (cm)","160",1],["kg","Gewicht je Stück (kg)","420",1],["f","Umrechnung (kg je m³)","333",1]],
    rechne:v => {
      const vol = v.anz * (v.l / 100) * (v.b / 100) * (v.h / 100);
      const volKg = vol * v.f, tat = v.anz * v.kg;
      return [["Volumen", zahl(vol, 3) + " m³"], ["Volumengewicht", zahl(volKg, 0) + " kg"], ["Tatsächliches Gewicht", zahl(tat, 0) + " kg"],
              ["Frachtpflichtig", zahl(Math.max(volKg, tat), 0) + " kg"]];
    } },
  { id:"rc_ldm", titel:"Lademeter und Nutzlast",
    felder:[["plaetze","Palettenplätze","8",1],["ldm","Lademeter je Platz","0,4",1],["kgldm","kg je Lademeter","1850",1],["tat","Tatsächliches Gewicht (kg)","4000",1],["zgg","zGG Fahrzeug (t)","40",1],["leer","Leergewicht (t)","15,2",1]],
    rechne:v => {
      const ldm = v.plaetze * v.ldm, frachtKg = ldm * v.kgldm;
      return [["Lademeter", zahl(ldm, 2) + " ldm"], ["Gewicht aus Lademetern", zahl(frachtKg, 0) + " kg"],
              ["Frachtpflichtig", zahl(Math.max(frachtKg, v.tat), 0) + " kg"], ["Nutzlast Fahrzeug", zahl(v.zgg - v.leer, 1) + " t"]];
    } },
  { id:"rc_luft", titel:"Luftfracht – Chargeable Weight und Rate",
    felder:[["l","Länge (cm)","110",1],["b","Breite (cm)","80",1],["h","Höhe (cm)","90",1],["kg","Tatsächliches Gewicht (kg)","95",1],["rate","Rate (EUR/kg)","2,80",1],["stufe","Nächste Gewichtsstufe (kg)","0",1],["stufenrate","Rate der Stufe (EUR/kg)","0",1],["min","Mindestfracht (EUR)","150",1]],
    rechne:v => {
      const volKg = v.l * v.b * v.h / 6000, cw = Math.max(volKg, v.kg);
      const fracht = Math.max(cw * v.rate, v.min);
      const stufe = v.stufe > 0 && v.stufenrate > 0 ? v.stufe * v.stufenrate : null;
      const aus = [["Volumengewicht", zahl(volKg, 1) + " kg"], ["Chargeable Weight", zahl(cw, 1) + " kg"], ["Fracht", zahl(fracht, 2) + " EUR"]];
      if (stufe !== null) aus.push(["Höhere Gewichtsstufe", zahl(stufe, 2) + " EUR"], ["Günstiger", stufe < fracht ? "höhere Stufe: " + zahl(stufe, 2) + " EUR" : "tatsächliches Gewicht: " + zahl(fracht, 2) + " EUR"]);
      return aus;
    } },
  { id:"rc_see", titel:"Seefracht W/M",
    felder:[["anz","Packstücke","12",1],["vol","Volumen je Stück (m³)","0,9",1],["kg","Gewicht je Stück (kg)","600",1],["rate","Rate je Frachteinheit","95",1],["thc","Zuschläge gesamt (THC, BAF …)","0",1]],
    rechne:v => {
      const vol = v.anz * v.vol, t = v.anz * v.kg / 1000, fe = Math.max(vol, t);
      return [["Volumen", zahl(vol, 2) + " m³"], ["Gewicht", zahl(t, 3) + " t"], ["Frachteinheiten (W/M)", zahl(fe, 2)],
              ["Fracht", zahl(fe * v.rate + v.thc, 2)]];
    } },
  { id:"rc_haft", titel:"Haftungshöchstbetrag",
    felder:[["kg","Gewicht der Sendung (kg)","850",1],["szr","Kurs 1 SZR in EUR","1,18",1],["stueck","Packstücke (nur Seefracht)","0",1],["wert","Warenwert (EUR)","25000",1]],
    rechne:v => {
      const z = (szrKg) => zahl(v.kg * szrKg * v.szr, 2) + " EUR";
      const see = Math.max(v.kg * 2, (v.stueck || 0) * 666.67) * v.szr;
      const cmr = v.kg * 8.33 * v.szr;
      return [["Straße (CMR/HGB, 8,33 SZR/kg)", z(8.33)], ["Schiene (CIM, 17 SZR/kg)", z(17)],
              ["Luftfracht (MÜ, 22 SZR/kg)", z(22)], ["Seefracht (2 SZR/kg bzw. 666,67 je Stück)", zahl(see, 2) + " EUR"],
              ["Deckungslücke bei Straßentransport", zahl(Math.max(0, v.wert - cmr), 2) + " EUR"]];
    } },
  { id:"rc_lager", titel:"Lagerkennzahlen",
    felder:[["ab","Anfangsbestand (EUR)","180000",1],["eb","Endbestand (EUR)","120000",1],["abgang","Jahresabgang (EUR)","1200000",1],["zins","Jahreszinssatz (%)","6",1]],
    rechne:v => {
      const d = (v.ab + v.eb) / 2, uh = d ? v.abgang / d : 0, dauer = uh ? 360 / uh : 0, lz = v.zins * dauer / 360;
      return [["⌀ Lagerbestand", zahl(d, 2) + " EUR"], ["Umschlagshäufigkeit", zahl(uh, 2)],
              ["⌀ Lagerdauer", zahl(dauer, 1) + " Tage"], ["Lagerzinssatz", zahl(lz, 2) + " %"], ["Lagerzinsen", zahl(d * lz / 100, 2) + " EUR"]];
    } },
  { id:"rc_zoll", titel:"Einfuhrabgaben",
    felder:[["wert","Warenwert (EUR)","24000",1],["frachtEU","Fracht bis EU-Grenze (EUR)","1500",1],["zollsatz","Zollsatz (%)","4,7",1],["frachtIn","Fracht im Inland (EUR)","300",1],["ust","Steuersatz EUSt (%)","19",1]],
    rechne:v => {
      const zw = v.wert + v.frachtEU, zoll = zw * v.zollsatz / 100, bg = zw + zoll + v.frachtIn, eust = bg * v.ust / 100;
      return [["Zollwert", zahl(zw, 2) + " EUR"], ["Zoll", zahl(zoll, 2) + " EUR"], ["Bemessungsgrundlage EUSt", zahl(bg, 2) + " EUR"],
              ["Einfuhrumsatzsteuer", zahl(eust, 2) + " EUR"], ["Abgaben gesamt", zahl(zoll + eust, 2) + " EUR"]];
    } },
  { id:"rc_db", titel:"Deckungsbeitrag und Break-even",
    felder:[["erloes","Erlös je Sendung (EUR)","420",1],["var","Variable Kosten je Sendung (EUR)","265",1],["fix","Fixkosten je Periode (EUR)","46500",1],["menge","Geplante Sendungen","350",1]],
    rechne:v => {

/* ===================== Prüfungssimulation ===================== */
/* Leistungserstellung besteht aus zwei Teilen: der verkehrsträgerübergreifende Teil
   zählt 70 Punkte, der verkehrsträgerspezifische 30. Den Verkehrsträger wählt man vor dem Start. */
const LEL_TRAEGER = {
  strasse: { name: "Straßenverkehr", themen: ["t_strasse", "t_bab"] },
  luft:    { name: "Luftfrachtverkehr", themen: ["t_luft"] }
};
const LEL_PUNKTE = { ueb: 70, spez: 30 };

const PRUEFUNGSSATZ = { lel: { mc: 26, num: 4 }, ksk: { mc: 12, num: 6 }, wiso: { mc: 12, num: 0 } };

function noteZuPunkten(p) {
  if (p >= 92) return { note: 1, text: "sehr gut" };
  if (p >= 81) return { note: 2, text: "gut" };
  if (p >= 67) return { note: 3, text: "befriedigend" };
  if (p >= 50) return { note: 4, text: "ausreichend" };
  if (p >= 30) return { note: 5, text: "mangelhaft" };
  return { note: 6, text: "ungenügend" };
}

/* Mischt die Antworten einer Aufgabe im Prüfungsformat */
function mischAufgabe(a) {
  const kopie = Object.assign({}, a);
  if (a.typ === "mc") {
    const p = mische(a.o.map((_, i) => i));
    kopie.o = p.map(i => a.o[i]);
    kopie.a = p.indexOf(a.a);
  }
  if (a.typ === "mehrfach") {
    const p = mische(a.o.map((_, i) => i));
    kopie.o = p.map(i => a.o[i]);
    kopie.a = a.a.map(i => p.indexOf(i)).sort((x, y) => x - y);
  }
  if (a.typ === "zuordnung") kopie.zeilen = mische(a.zeilen);
  if (a.typ === "reihenfolge") kopie.anzeige = mische(a.schritte.map((_, i) => i));
  return kopie;
}

/* Stellt einen Prüfungssatz nach dem Muster der IHK-Prüfung zusammen */
function ziehePruefungsformat(bid) {
  const f = PRUEFUNGSFORMAT[bid];
  const pool = PRUEFUNGSAUFGABEN.filter(a => a.b === bid);
  let aus = [];
  Object.keys(f.mix).forEach(typ => {
    aus = aus.concat(mische(pool.filter(a => a.typ === typ)).slice(0, f.mix[typ])
      .map(a => ({ art: a.typ, d: mischAufgabe(a), teil: "ueb", p: a.p })));
  });
  aus = mische(aus);
  /* Aufgaben mit gemeinsamer Situationsvorgabe stehen zusammen */
  const gesehen = [];
  aus.forEach(t => { const s = t.d.si || ""; if (gesehen.indexOf(s) < 0) gesehen.push(s); });
  return aus.slice().sort((x, y) => gesehen.indexOf(x.d.si || "") - gesehen.indexOf(y.d.si || ""));
}

/* Zieht Aufgaben aus den angegebenen Themen; fehlende Rechenaufgaben werden
   durch zusätzliche Wissensfragen ersetzt. */
function zieheAufgaben(themen, mcAnzahl, numAnzahl, teil) {
  const num = mische(RECHNEN.filter(r => themen.indexOf(r.t) >= 0)).slice(0, numAnzahl);
  const mc = mische(FRAGEN.filter(q => themen.indexOf(q.t) >= 0))
    .slice(0, mcAnzahl + (numAnzahl - num.length));
  return mc.map(q => ({ art: "mc", d: mischOptionen(q), teil: teil }))
    .concat(num.map(r => ({ art: "num", d: r, teil: teil })));
}

function pruefungStarten(bid, traeger) {
  let teile;
  if (PRUEFUNGSFORMAT[bid]) {
    teile = ziehePruefungsformat(bid);
  } else if (bid === "lel") {
    const spez = LEL_TRAEGER[traeger] || LEL_TRAEGER.strasse;
    const spezialthemen = [];
    Object.keys(LEL_TRAEGER).forEach(k => LEL_TRAEGER[k].themen.forEach(t => spezialthemen.push(t)));
    const uebergreifend = THEMEN.filter(t => t.b === "lel" && spezialthemen.indexOf(t.id) < 0).map(t => t.id);
    teile = mische(zieheAufgaben(uebergreifend, 18, 3, "ueb").concat(zieheAufgaben(spez.themen, 8, 1, "spez")));
  } else {
    const themen = THEMEN.filter(t => t.b === bid).map(t => t.id);
    const satz = PRUEFUNGSSATZ[bid];
    teile = mische(zieheAufgaben(themen, satz.mc, satz.num, "ueb"));
  }
  S.pruefung = { aktiv: true, modus: "mc", bereich: bid, traeger: bid === "lel" ? (traeger || "strasse") : null,
                 teile: teile, antworten: teile.map(() => null), idx: 0,
                 endzeit: Date.now() + (PRUEFUNGSFORMAT[bid] ? PRUEFUNGSFORMAT[bid].minuten : bereich(bid).min) * 60000,
                 tick: null, ergebnis: null };
  S.pruefung.tick = setInterval(() => {
    if (!S.pruefung.aktiv) return;
    const u = $("#pruef-uhr");
    const rest = S.pruefung.endzeit - Date.now();
    if (rest <= 0) { pruefungAuswerten(); return; }
    if (u) {
      const m = Math.floor(rest / 60000), s = Math.floor(rest % 60000 / 1000);
      u.textContent = m + ":" + String(s).padStart(2, "0");
      u.classList.toggle("knapp", rest < 300000);
    }
  }, 1000);
  rPruefung();
}

/* Anteil der erreichten Punkte einer Aufgabe, 0 bis 1 */
function anteilRichtig(t, a) {
  const d = t.d;
  if (t.art === "mc") return a === d.a ? 1 : 0;
  if (t.art === "offen") {
    if (a === null || a === undefined || a === "") return 0;
    if (d.format === "datum") {
      const norm = s => String(s).replace(/\s/g, "").replace(/[-\/]/g, ".");
      return norm(a) === norm(d.a) ? 1 : 0;
    }
    const z = typeof a === "number" ? a : zuZahl(a);
    return isFinite(z) && Math.abs(z - d.a) <= (d.tol || 0.01) ? 1 : 0;
  }
  if (t.art === "mehrfach") {
    if (!Array.isArray(a) || !a.length) return 0;
    const treffer = a.filter(i => d.a.indexOf(i) >= 0).length;
    const falsch = a.length - treffer;
    return Math.max(0, (treffer - falsch) / d.anzahl);
  }
  if (t.art === "zuordnung") {
    if (!Array.isArray(a)) return 0;
    const treffer = d.zeilen.filter((z, i) => a[i] === z.a).length;
    return treffer / d.zeilen.length;
  }
  if (t.art === "reihenfolge") {
    if (!Array.isArray(a)) return 0;
    const treffer = d.anzeige.filter((urspruenglich, j) => a[j] === urspruenglich + 1).length;
    return treffer / d.anzeige.length;
  }
  return 0;
}

function pruefungAuswerten() {
  if (S.pruefung.tick) { clearInterval(S.pruefung.tick); S.pruefung.tick = null; }
  let richtig = 0;
  const nachThema = {};
  const nachTeil = { ueb: { r: 0, n: 0 }, spez: { r: 0, n: 0 } };
  let erreicht = 0, moeglich = 0;
  S.pruefung.teile.forEach((t, i) => {
    const a = S.pruefung.antworten[i];
    const anteil = anteilRichtig(t, a);
    const ok = anteil === 1;
    erreicht += (t.p || 1) * anteil;
    moeglich += (t.p || 1);
    if (ok) richtig += 1;
    frageBewerten(t.d.id, ok);
    const k = t.d.t;
    nachThema[k] = nachThema[k] || { r: 0, n: 0 };
    nachThema[k].n += 1; if (ok) nachThema[k].r += 1;
    const teil = nachTeil[t.teil] ? t.teil : "ueb";
    nachTeil[teil].n += 1; if (ok) nachTeil[teil].r += 1;
  });
  let punkte;
  if (PRUEFUNGSFORMAT[S.pruefung.bereich]) {
    punkte = Math.round(erreicht / Math.max(1, moeglich) * PRUEFUNGSFORMAT[S.pruefung.bereich].punkte);
  } else if (S.pruefung.bereich === "lel" && nachTeil.spez.n) {
    punkte = Math.round(LEL_PUNKTE.ueb * nachTeil.ueb.r / Math.max(1, nachTeil.ueb.n) +
                        LEL_PUNKTE.spez * nachTeil.spez.r / Math.max(1, nachTeil.spez.n));
  } else {
    punkte = Math.round(richtig / Math.max(1, S.pruefung.teile.length) * 100);
  }
  const n = noteZuPunkten(punkte);
  S.pruefung.aktiv = false;
  S.pruefung.ergebnis = { richtig: richtig, gesamt: S.pruefung.teile.length, punkte: punkte, note: n,
                          nachThema: nachThema, nachTeil: nachTeil, traeger: S.pruefung.traeger };
  F.pruefungen = (F.pruefungen || []).concat([{ bereich: S.pruefung.bereich, datum: heuteStr(),
    punkte: punkte, note: n.note, traeger: S.pruefung.traeger }]).slice(-20);
  sichern();
  rPruefung();
}

function rPruefung() {
  const w = $("#v-pruefung");
  if (S.pruefung.modus === "frei") {
    if (S.pruefung.ergebnis) { w.innerHTML = stgErgebnisHtml(); bindStgErgebnis(); return; }
    if (S.pruefung.aktiv) { w.innerHTML = stgLaufHtml(); bindStgLauf(); return; }
  }
  if (S.pruefung.ergebnis) { w.innerHTML = pruefErgebnisHtml(); bindPruefErgebnis(); return; }
  if (S.pruefung.aktiv) { w.innerHTML = pruefLaufHtml(); bindPruefLauf(); return; }
  w.innerHTML = pruefStartHtml(); bindPruefStart();
}

  const satz = STG_SAETZE.find(s => s.id === satzId) || STG_SAETZE[0];

        situation: a.situation, anlage: a.anlage, anlagen: anlagenQuelle, teilName: teilName,
        schluessel: teilKennung + "-" + t.nr }) });

                 idx: 0, endzeit: Date.now() + satz.minuten * 60000, tick: null, ergebnis: null };
  S.pruefung.tick = setInterval(() => {
    if (!S.pruefung.aktiv) return;
    const u = $("#pruef-uhr");
    const rest = S.pruefung.endzeit - Date.now();
    if (rest <= 0) { stgAuswerten(); return; }
    if (u) {
      const m = Math.floor(rest / 60000), s = Math.floor(rest % 60000 / 1000);
      u.textContent = m + ":" + String(s).padStart(2, "0");
      u.classList.toggle("knapp", rest < 900000);

function stgPunkteStand() {
  let erreicht = 0, moeglich = 0, bewertet = 0;
  const jeTeil = { ueb: { e: 0, m: 0 }, spez: { e: 0, m: 0 } };
  S.pruefung.teile.forEach((t, i) => {
    moeglich += t.p;
    jeTeil[t.teil].m += t.p;
    const p = S.pruefung.punkteSelbst[i];
    if (p !== null && p !== undefined) { erreicht += p; bewertet += 1; jeTeil[t.teil].e += p; }
  });
  return { erreicht: erreicht, moeglich: moeglich, bewertet: bewertet,
           offen: S.pruefung.teile.length - bewertet, jeTeil: jeTeil };
}

    const d = t.d;
    if (d.schluessel.split("-")[0] + d.aufgabe !== letzteAufgabe) {
      letzteAufgabe = d.schluessel.split("-")[0] + d.aufgabe;
      html += '<div class="karte"><div class="karte-kopf"><h3>' + esc(d.teilName) + " · " + d.aufgabe + ". Aufgabe</h3>" +
        '<span class="chip" style="margin-left:auto">' + zahl(d.aufgabePunkte, d.aufgabePunkte % 1 ? 1 : 0) + " Punkte</span></div>" +
        '<div class="karte-leib stapel">';
    }
    const schritte = [];
    for (let p = 0; p <= t.p + 0.001; p += 0.5) schritte.push(Math.round(p * 10) / 10);
    html += '<div class="teilauswertung"><p><b>' + esc(d.nr) + "</b> " + esc(d.q) + "</p>" +
      '<div class="loesungsblock"><b>Deine Antwort</b>' +
      (S.pruefung.antworten[i] ? esc(S.pruefung.antworten[i]).replace(/\n/g, "<br>") : "<i>nicht beantwortet</i>") + "</div>" +
      '<div class="loesungsblock" style="border-color:var(--signal)"><b>Lösungshinweise · ' +
      zahl(d.punkte, d.punkte % 1 ? 1 : 0) + " Punkte</b>" + esc(d.loesung).replace(/\n/g, "<br>") + "</div>" +
      '<label class="feld" style="max-width:220px"><span>Punkte vergeben</span><select data-selbst="' + i + '">' +
      '<option value="">– noch offen –</option>' +
      schritte.map(p => '<option value="' + p + '"' +
        (S.pruefung.punkteSelbst[i] === p ? " selected" : "") + ">" + zahl(p, p % 1 ? 1 : 0) + " von " +
        zahl(t.p, t.p % 1 ? 1 : 0) + "</option>").join("") + "</select></label></div>";
    const naechste = S.pruefung.teile[i + 1];
    if (!naechste || naechste.d.schluessel.split("-")[0] + naechste.d.aufgabe !== letzteAufgabe) html += "</div></div>";
  });
  return html;
}

function bindPruefLauf() {
  const t = S.pruefung.teile[S.pruefung.idx];
  const merken = () => {
    if (t.art === "offen") {
      const f = $("#pruef-offen");
      if (f) S.pruefung.antworten[S.pruefung.idx] = f.value.trim() === "" ? null : f.value.trim();
    } else if (t.art === "num") {
      const f = $("#pruef-zahl");
      if (f) { const n = zuZahl(f.value); S.pruefung.antworten[S.pruefung.idx] = isFinite(n) ? n : null; }
    } else if (t.art === "mehrfach") {
      const gewaehlt = [];
      alle("[data-mopt]", $("#v-pruefung")).forEach(c => { if (c.checked) gewaehlt.push(parseInt(c.dataset.mopt, 10)); });
      S.pruefung.antworten[S.pruefung.idx] = gewaehlt.length ? gewaehlt : null;
    } else if (t.art === "zuordnung" || t.art === "reihenfolge") {
      const werte = [];
      alle("[data-zeile]", $("#v-pruefung")).forEach(s => {
        werte[parseInt(s.dataset.zeile, 10)] = s.value === "" ? null : parseInt(s.value, 10);
      });
      S.pruefung.antworten[S.pruefung.idx] = werte.some(v => v !== null && v !== undefined) ? werte : null;
    }
  };
  alle("[data-popt]", $("#v-pruefung")).forEach(b => b.addEventListener("click", () => {
    S.pruefung.antworten[S.pruefung.idx] = parseInt(b.dataset.popt, 10);
    if (S.pruefung.idx + 1 < S.pruefung.teile.length) S.pruefung.idx += 1;
    rPruefung();
  }));
  const zf = $("#pruef-zahl"); if (zf) zf.addEventListener("input", merken);
  const of = $("#pruef-offen"); if (of) of.addEventListener("input", merken);
  alle("[data-zeile]", $("#v-pruefung")).forEach(s => s.addEventListener("change", merken));
  alle("[data-mopt]", $("#v-pruefung")).forEach(c => c.addEventListener("change", merken));
  alle("[data-sprung]", $("#v-pruefung")).forEach(b => b.addEventListener("click", () => {
    merken(); S.pruefung.idx = parseInt(b.dataset.sprung, 10); rPruefung();
  }));
  $("#pruef-vor").addEventListener("click", () => {
    merken();
    if (S.pruefung.idx + 1 < S.pruefung.teile.length) { S.pruefung.idx += 1; rPruefung(); }
    else pruefungAuswerten();
  });
  $("#pruef-zurueck").addEventListener("click", () => {
    merken();
    if (S.pruefung.idx > 0) { S.pruefung.idx -= 1; rPruefung(); }
  });
  $("#pruef-abgeben").addEventListener("click", () => { merken(); pruefungAuswerten(); });
}

      t.zeilen.map(z => "<tr>" + z.map(c => "<td>" + esc(c) + "</td>").join("") + "</tr>").join("") +
      "</tbody></table></div>" + (t.id === "tb_bab" ? babTafel() : t.id === "tb_meer" ? seeTafel() : "") +
      (t.fuss ? '<div class="karte-leib"><p class="hinweis">' + esc(t.fuss) + "</p></div>" : "") + "</div>";
  });
  $("#v-tabellen").innerHTML = html;
}

/* ===================== Tastatur ===================== */
document.addEventListener("keydown", e => {
  const imFeld = ["INPUT", "SELECT", "TEXTAREA"].indexOf((e.target.tagName || "")) >= 0;
  if (imFeld) return;
  if (S.ansicht === "karten") {
    if (e.code === "Space") { e.preventDefault(); if (!S.lern.aufgedeckt) { S.lern.aufgedeckt = true; rKarten(); } return; }
    if (S.lern.aufgedeckt && (e.key === "1" || e.key === "2")) {
      const k = S.lern.stapel[0];
      if (k) { karteBewerten(k.id, e.key === "2"); S.lern.stapel.shift(); if (e.key === "1") S.lern.stapel.push(k); S.lern.aufgedeckt = false; rKarten(); }
    }
  }
  if (S.ansicht === "quiz" && !S.quiz.fertig) {
    if (["1", "2", "3", "4"].indexOf(e.key) >= 0 && S.quiz.gewaehlt === null) quizAntwort(parseInt(e.key, 10) - 1);
    else if (e.key === "Enter" && S.quiz.gewaehlt !== null) quizWeiter();
  }
});

/* ===================== Start ===================== */
(function init() {
  const gespeichert = lokalLesen();
  if (gespeichert) F = Object.assign(leerFortschritt(), gespeichert);
  alle(".reiter button").forEach(b => b.addEventListener("click", () => wechsle(b.dataset.ansicht)));
  const start = () => { wechsle(S.ansicht || "start"); geraeteAbgleich(); };
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ ansicht: S.ansicht }));
  if (hot && hot.ready) hot.ready(daten => { if (daten && daten.ansicht) S.ansicht = daten.ansicht; start(); });
  else start();
})();
